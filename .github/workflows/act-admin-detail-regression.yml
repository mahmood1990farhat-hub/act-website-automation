name: ACT admin detail targeted regression

"on":
  push:
    branches: [draft/act-admin-detail-fix-20261015]

permissions:
  contents: read

concurrency:
  group: act-admin-detail-isolated-regression
  cancel-in-progress: false

jobs:
  admin-detail-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Synthetic disposable services only. Never self-hosted or production.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: act_admin_detail_ci
          POSTGRES_USER: act
          POSTGRES_PASSWORD: isolated_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U act -d act_admin_detail_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ACT_E2E_ISOLATED: "1"
      SECRET_KEY: act-ci-admin-detail-never-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: act_admin_detail_ci
      DB_USER: act
      DB_PASSWORD: isolated_ci_only
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-not-production
      TWILIO_VERIFY_SERVICE_SID: VA00000000000000000000000000000000
      GOOGLE_MAPS_API_KEY: ci-not-production
      STRIPE_SECRET_KEY: sk_test_ci_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_real_secret
      CELERY_BROKER_URL: redis://127.0.0.1:6379/13
      N8N_ENABLED: "False"
      NOTIFICATION_FORCE_SYNC: "True"
      EMAIL_HOST: 127.0.0.1
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: ci-not-production
      ADMIN_EMAIL: admin@example.invalid
      APP_BASE_URL: http://127.0.0.1:8000
      ACT_PUBLIC_WEBSITE_URL: http://127.0.0.1:3001
      ACT_DRIVER_PRIVATE_UPLOAD_ROOT: /tmp/act-private-admin-detail-ci
      ACT_NI_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - name: Checkout exact draft commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Assert isolated environment and narrow code scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/draft/act-admin-detail-fix-20261015
          test "$DB_NAME" = act_admin_detail_ci
          test "$DB_HOST" = 127.0.0.1
          test "$N8N_ENABLED" = False
          test "$EMAIL_HOST" = 127.0.0.1
          test "$(git rev-parse HEAD^)" = 735c966dae10bb8b41bd7238cc7d3476750de1cc
          git diff --name-only HEAD^ HEAD > /tmp/act-admin-detail-paths
          printf '%s\n' '.github/workflows/act-admin-detail-regression.yml' 'act_backend-main/apps/drivers/test_admin_detail_response.py' 'act_backend-main/apps/drivers/views/unified_admin.py' > /tmp/act-admin-detail-expected
          diff -u /tmp/act-admin-detail-expected /tmp/act-admin-detail-paths
          echo "Exact backend draft: $GITHUB_SHA; existing release and frontend unchanged."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: act_backend-main/requirements.txt
      - name: Install existing locked-scope backend dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin libgdal-dev libgeos-dev
          python -m pip install -q -r act_backend-main/requirements.txt
      - name: Run only the admin availability and cache regressions
        working-directory: act_backend-main
        run: |
          python manage.py test apps.drivers.test_admin_detail_response --noinput --verbosity 2
      - name: Record exact targeted acceptance
        run: |
          echo "PASS: 10 admin-detail regressions for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No booking, payment, frontend rebuild, deployment or production operation." >> "$GITHUB_STEP_SUMMARY"
