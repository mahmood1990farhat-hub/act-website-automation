name: ACT isolated safety tests (manual)

# Branch-only preparation: workflow_dispatch must first be registered on the
# default branch. Do NOT merge this file to main without a deployment review.
# No push, pull_request, schedule or production deployment trigger is enabled.
"on":
  workflow_dispatch:
    inputs:
      confirm_synthetic_only:
        description: Run only the disposable synthetic safety harness
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: act-isolated-safety-tests
  cancel-in-progress: false

jobs:
  isolated-tests:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/isolated-backend-tests-20261001' &&
      inputs.confirm_synthetic_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the selected test-branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate configuration and source regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/act-config-checks"
          "$RUNNER_TEMP/act-config-checks/bin/pip" install 'PyYAML==6.0.2'
          cd act_backend-main
          "$RUNNER_TEMP/act-config-checks/bin/python" -m unittest discover -s tests -p test_onboarding_logging.py -v
          "$RUNNER_TEMP/act-config-checks/bin/python" -m unittest discover -s tests -p test_shared_exception_safety.py -v
          "$RUNNER_TEMP/act-config-checks/bin/python" -m unittest discover -s isolation -p test_config.py -v
          docker compose -f isolation/compose.yaml config --quiet

      - name: Build disposable test image
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f act_backend-main/isolation/compose.yaml build

      - name: Execute network-disabled test container
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f act_backend-main/isolation/compose.yaml run --rm --no-deps tests

      - name: Record scope
        if: always()
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          TEST_JOB_STATUS: ${{ job.status }}
        run: |
          printf '## ACT isolated safety harness\n\nCommit: `%s`\n\nJob status: %s\n\nSynthetic source regressions and minimal Django smoke tests only. Not full ACT signup or production readiness. No deployment steps.\n' "$TESTED_SHA" "$TEST_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
