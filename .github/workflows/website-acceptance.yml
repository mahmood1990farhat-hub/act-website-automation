name: ACT website acceptance checks

"on":
  push:
    branches: [act/website-booking-audit-20261004]
  pull_request:
    branches: [codex/complete-customer-languages-20261002]

permissions:
  contents: read

jobs:
  backend-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: act_test
          POSTGRES_USER: act
          POSTGRES_PASSWORD: act_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U act -d act_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025
    env:
      SECRET_KEY: ci-not-production
      DEBUG: "False"
      DB_NAME: act_test
      DB_USER: act
      DB_PASSWORD: act_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-not-production
      TWILIO_VERIFY_SERVICE_SID: VA00000000000000000000000000000000
      GOOGLE_MAPS_API_KEY: ci-not-production
      STRIPE_SECRET_KEY: sk_test_ci_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_real_secret
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: ci-not-production
      ADMIN_EMAIL: admin@example.invalid
      APP_BASE_URL: https://api.example.invalid
      ACT_EMAIL_ASSETS_BASE_URL: https://api.example.invalid/static/email-assets
      N8N_ENABLED: "False"
    defaults:
      run:
        working-directory: act_backend-main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: act_backend-main/requirements.txt
      - name: Install GeoDjango system libraries
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Migration consistency
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --plan
      - name: Celery worker discovers paid-booking confirmation task
        run: |
          celery -A myProject worker --pool=solo --loglevel=INFO --hostname=ci-worker@%h > /tmp/act-celery.log 2>&1 &
          echo $! > /tmp/act-celery.pid
          for i in {1..20}; do
            if celery -A myProject inspect registered 2>/dev/null | grep -q "apps.payments.tasks.deliver_paid_booking_confirmations"; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/act-celery.log
          exit 1
      - name: SMTP server accepts an ACT test message
        run: |
          python manage.py shell -c "from django.core.mail import send_mail; result=send_mail('ACT CI SMTP acceptance','Isolated acceptance only','ci@example.invalid',['passenger@example.invalid'],fail_silently=False); assert result == 1"
          python - <<'PY'
          import json, urllib.request
          data = json.load(urllib.request.urlopen("http://127.0.0.1:8025/api/v2/messages"))
          assert data["total"] >= 1, data
          subjects = [item.get("Content", {}).get("Headers", {}).get("Subject", []) for item in data["items"]]
          assert any("ACT CI SMTP acceptance" in values for values in subjects), subjects
          PY
      - name: Payment, confirmation, PDF and vehicle-code regression tests
        run: >
          python manage.py test
          apps.payments.test_webhook_reliability
          apps.payments.test_booking_confirmations
          apps.payments.test_urls
          apps.trips.tests.test_booking_confirmation_download
          apps.trips.tests.test_google_maps_initialization
          apps.trips.tests.test_meet_and_greet_pricing
          apps.pricing.tests.test_monotonic_pricing
          apps.pricing.tests.test_pricing_engine
          apps.vehicle.tests.test_vehicle_class_codes
          --verbosity 2
      - name: Real Stripe sandbox successful payment and ACT webhook fulfillment
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
        run: >
          python manage.py test
          apps.payments.test_stripe_sandbox_acceptance
          --verbosity 2


  stripe-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Stripe SDK
        run: pip install stripe==12.5.1
      - name: Verify sandbox API and PaymentIntent lifecycle
        run: |
          python - <<'PY'
          import os
          import stripe

          key = os.environ.get("STRIPE_SANDBOX_SECRET_KEY", "")
          assert key.startswith("sk_"), "STRIPE_SANDBOX_SECRET_KEY is missing or invalid"
          stripe.api_key = key

          account = stripe.Account.retrieve()
          assert account.id, "Stripe sandbox account could not be retrieved"

          intent = stripe.PaymentIntent.create(
              amount=100,
              currency="gbp",
              payment_method_types=["card"],
              metadata={
                  "act_acceptance": "website-payment-booking",
                  "environment": "sandbox",
              },
              description="ACT Website Acceptance - sandbox only",
          )
          assert intent.id.startswith("pi_")
          assert intent.amount == 100
          assert intent.currency == "gbp"
          assert intent.livemode is False, "Refusing to run acceptance against live Stripe mode"

          retrieved = stripe.PaymentIntent.retrieve(intent.id)
          assert retrieved.id == intent.id
          assert retrieved.livemode is False

          cancelled = stripe.PaymentIntent.cancel(intent.id)
          assert cancelled.status == "canceled"
          assert cancelled.livemode is False

          print("PASS Stripe sandbox authentication and non-live PaymentIntent lifecycle")
          PY

  frontend-booking:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production frontend image
        run: docker build -f act_website-main/tests/frontend.Dockerfile -t act-booking act_website-main
      - name: Booking regression guards
        run: |
          for test in             tests/check-quote-coordinate-validation.cjs             tests/check-quote-state-invalidation.cjs             tests/check-booking-journey-summary.cjs             tests/check-vehicle-selection-safety.cjs             tests/check-vehicle-image-fallback.cjs             tests/check-vehicle-class-rename.cjs             tests/check-passenger-flight-review-handoff.cjs             tests/check-payment-fulfillment-safety.cjs
          do
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges act-booking node "$test"
          done
