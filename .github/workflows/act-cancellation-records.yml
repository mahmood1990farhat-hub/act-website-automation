name: ACT cancellation records integration
"on":
  push:
    branches: [draft/act-cancellation-records-20261025]
permissions:
  contents: read
concurrency:
  group: act-cancellation-records-isolated
  cancel-in-progress: false
jobs:
  postgres-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: act_contract_ci
          POSTGRES_USER: act
          POSTGRES_PASSWORD: isolated_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U act -d act_contract_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    env:
      ACT_E2E_ISOLATED: "1"
      SECRET_KEY: act-ci-contracts-never-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: act_contract_ci
      DB_USER: act
      DB_PASSWORD: isolated_ci_only
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-not-production
      TWILIO_VERIFY_SERVICE_SID: VA00000000000000000000000000000000
      GOOGLE_MAPS_API_KEY: ci-not-production
      STRIPE_SECRET_KEY: sk_test_ci_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_real_secret
      CELERY_BROKER_URL: redis://127.0.0.1:6379/13
      N8N_ENABLED: "False"
      NOTIFICATION_FORCE_SYNC: "True"
      EMAIL_HOST: 127.0.0.1
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: ci-not-production
      ADMIN_EMAIL: admin@example.invalid
      APP_BASE_URL: http://127.0.0.1:8000
      ACT_PUBLIC_WEBSITE_URL: http://127.0.0.1:3001
      ACT_DRIVER_PRIVATE_UPLOAD_ROOT: /tmp/act-contract-ci
      ACT_NI_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard scope and preserve completed calculator
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/draft/act-cancellation-records-20261025
          git merge-base --is-ancestor 5f309ea9441414ce76a1725d0d00b1497a67e177 HEAD
          test "$DB_NAME" = act_contract_ci
          test "$DB_HOST" = 127.0.0.1
          mkdir -p record-evidence
          git diff --name-only 5f309ea9441414ce76a1725d0d00b1497a67e177 HEAD > record-evidence/changed-paths.txt
          while read -r p; do
            case "$p" in
              act_backend-main/apps/payments/models.py|act_backend-main/apps/payments/booking_contracts.py|act_backend-main/apps/payments/migrations/0003_booking_terms_refund_records.py|act_backend-main/apps/payments/test_booking_contracts.py|docs/review/ACT_CANCELLATION_RECORDS_2026-10-25.md|.github/workflows/act-cancellation-records.yml) ;;
              *) echo "STOP: Unexpected path $p"; exit 1 ;;
            esac
          done < record-evidence/changed-paths.txt
          git rev-parse HEAD > record-evidence/source-sha.txt
          test "$(git rev-parse HEAD:act_backend-main/apps/trips/services/cancellation_policy.py)" = 631eef05f96e4a4885540e937b42e7f9fa85f1ee
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: act_backend-main/requirements.txt
      - name: Install existing dependency constraints in isolated runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin libgdal-dev libgeos-dev
          python -m pip install -q -r act_backend-main/requirements.txt
          python --version > record-evidence/python-version.txt
          python -m pip freeze > record-evidence/installed-versions.txt
      - name: Check migration consistency and new database services only
        working-directory: act_backend-main
        shell: bash
        run: |
          set -Eeuo pipefail
          python manage.py makemigrations payments --check --dry-run 2>&1 | tee ../record-evidence/migration-check.txt
          python manage.py test apps.payments.test_booking_contracts --noinput --verbosity 2 2>&1 | tee ../record-evidence/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: act-cancellation-records-${{ github.sha }}
          path: record-evidence/
          if-no-files-found: error
          retention-days: 14
