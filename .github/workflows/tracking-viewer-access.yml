name: ACT tracking viewer access

"on":
  push:
    branches: [draft/act-tracking-access-backend-20261106]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracking-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: act_tracking_test
          POSTGRES_USER: act
          POSTGRES_PASSWORD: isolated_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U act -d act_tracking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ACT_TRACKING_ACCESS_TESTS: "1"
      DJANGO_SETTINGS_MODULE: myProject.settings.tracking_tests
      SECRET_KEY: isolated-tracking-tests-never-use-in-production
      DEBUG: "False"
      DB_NAME: act_tracking_test
      DB_USER: act
      DB_PASSWORD: isolated_tracking_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: isolated-test-not-a-real-key
      TWILIO_VERIFY_SERVICE_SID: VA00000000000000000000000000000000
      GOOGLE_MAPS_API_KEY: isolated-test-not-a-real-key
      STRIPE_SECRET_KEY: sk_test_isolated_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_isolated_not_a_real_secret
      FIREBASE_CREDENTIALS_PATH: tests/no-firebase-credentials.json
      REDIS_URL: redis://127.0.0.1:1/0
      CELERY_BROKER_URL: memory://
      EMAIL_HOST: localhost
      EMAIL_PORT: "1"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: isolated-test-not-a-real-key
      ADMIN_EMAIL: admin@example.invalid
      APP_BASE_URL: https://api.example.invalid
      ACT_PUBLIC_WEBSITE_URL: https://website.example.invalid
      ACT_EMAIL_ASSETS_BASE_URL: https://api.example.invalid/static/email-assets
      N8N_ENABLED: "False"
    defaults:
      run:
        working-directory: act_backend-main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify narrow source scope and source revision
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/draft/act-tracking-access-backend-20261106
          mkdir -p tracking-access-evidence
          git rev-parse HEAD > tracking-access-evidence/source-sha.txt
          git diff --name-only 82c0b14ad2a71e1ce3d8d1df3527431b698ac461 HEAD > tracking-access-evidence/changed-paths.txt
          while IFS= read -r path; do
            case "$path" in
              act_backend-main/apps/trips/consumers.py|act_backend-main/apps/trips/tests/test_tracking_access.py|act_backend-main/apps/trips/tests/tracking_test_urls.py|act_backend-main/myProject/settings/tracking_tests.py|.github/workflows/tracking-viewer-access.yml|docs/review/ACT_TRACKING_ACCESS_2026-11-06.md|docs/review/evidence/ACT_TRACKING_ACCESS_2026-11-06.json) ;;
              *) echo "Unexpected source path: $path"; exit 1 ;;
            esac
          done < tracking-access-evidence/changed-paths.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: act_backend-main/requirements.txt
      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - name: Install unchanged backend dependencies
        run: pip install -r requirements.txt
      - name: Run only tracking access and lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          python --version > ../tracking-access-evidence/python-version.txt
          pip freeze > ../tracking-access-evidence/dependencies.txt
          python manage.py test apps.trips.tests.test_tracking_access --verbosity 2 --noinput 2>&1 | tee ../tracking-access-evidence/tests.txt
      - name: Preserve source and test evidence
        if: always()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- act_backend-main .github/workflows/tracking-viewer-access.yml
          sha256sum act_backend-main/apps/trips/consumers.py act_backend-main/apps/trips/tests/test_tracking_access.py act_backend-main/apps/trips/tests/tracking_test_urls.py act_backend-main/myProject/settings/tracking_tests.py .github/workflows/tracking-viewer-access.yml > tracking-access-evidence/file-sha256.txt
      - name: Upload focused evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-tracking-viewer-access-${{ github.sha }}
          path: tracking-access-evidence/
          if-no-files-found: error
