name: ACT policy review bundle
"on":
  push:
    branches: [draft/act-policy-bundle-20261026]
permissions:
  contents: read
concurrency:
  group: act-policy-review-bundle
  cancel-in-progress: false
jobs:
  matched-review-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve application and original generator behaviour
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/draft/act-policy-bundle-20261026
          BASE=4e469cf93327d89d7e28a09cd8ef3cc96b011f8a
          git merge-base --is-ancestor "$BASE" HEAD
          mkdir -p policy-evidence
          git diff --name-only "$BASE" HEAD > policy-evidence/changed-paths.txt
          while read -r file; do
            case "$file" in
              act_website-main/scripts/build-customer-documents.py|act_website-main/scripts/policy_review_bundle.py|act_website-main/tests/policy-bundle/test_bundle.py|docs/policy-releases/act-policy-review-20261026.json|docs/review/ACT_CUSTOMER_BOOKING_TERMS_DRAFT_2026-10-22.md|docs/review/ACT_DRIVER_POLICIES_DRAFT_2026-10-21.md|docs/review/ACT_POLICY_BUNDLE_2026-10-26.md|.github/workflows/act-policy-review-bundle.yml) ;;
              *) echo "STOP: Unexpected changed path $file"; exit 1 ;;
            esac
          done < policy-evidence/changed-paths.txt
          git diff --exit-code "$BASE" HEAD -- act_backend-main act_website-main/src act_website-main/public act_website-main/package-lock.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('act_website-main/scripts/build-customer-documents.py')
          s=p.read_text(); start=s.index('# Explicit review mode'); end=s.index('import hashlib, html, json, os',start)
          original=(s[:start]+s[end:]).encode()
          assert hashlib.sha1(f'blob {len(original)}\0'.encode()+original).hexdigest()=='e827bc25d332e7b227d5c434efcb2b79d57cebf3'
          assert 'raise SystemExit(review_main())' in s[start:end]
          print('Legacy generator exact outside explicit review-mode dispatch; application/public assets unchanged.')
          PY
          git rev-parse HEAD > policy-evidence/source-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated document-test tools, not application dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install -q WeasyPrint==68.0 PyMuPDF==1.26.7
          python --version > policy-evidence/python-version.txt
          python -m pip freeze > policy-evidence/tool-versions.txt
      - name: Test source, document, disabled configuration and path consistency
        shell: bash
        run: |
          set -Eeuo pipefail
          python act_website-main/tests/policy-bundle/test_bundle.py 2>&1 | tee policy-evidence/tests.txt
          python act_website-main/scripts/build-customer-documents.py \
            --review-bundle docs/policy-releases/act-policy-review-20261026.json \
            --output "$RUNNER_TEMP/act-policy-review"
          python act_website-main/scripts/build-customer-documents.py \
            --verify-review-bundle "$RUNNER_TEMP/act-policy-review"
          cp -a "$RUNNER_TEMP/act-policy-review" policy-evidence/review-bundle
          git diff --exit-code -- act_website-main/public act_website-main/src act_backend-main
          echo 'REVIEW DOCUMENTS MATCH CHECKOUT TEXT - NO PUBLICATION OR DEPLOYMENT'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: act-policy-review-bundle-${{ github.sha }}
          path: policy-evidence/
          if-no-files-found: error
          retention-days: 14
