name: Verify combined ACT route preview release
on:
  push:
    branches: [draft/booking-map-combined-release-20261125]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  booking-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: synthetic-test-only
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_synthetic
    defaults:
      run:
        working-directory: act_website-main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: act_website-main/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check route preview and quote behaviour
        run: |
          node tests/check-route-map-pins.cjs
          node tests/check-route-preview.cjs
          node tests/check-booking-journey-summary.cjs
          node tests/check-quote-coordinate-validation.cjs
          node tests/check-quote-state-invalidation.cjs
      - name: Build the passenger website and check types
        run: |
          npm run build
          npx --no-install tsc --noEmit
      - name: Install Chromium for the existing booking browser test
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/browser-test
          npm install --prefix /opt/browser-test --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /opt/browser-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Test address selection in English and Arabic with simulated services
        run: node tests/check-client-booking.cjs

  route-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: act_tracking_test
          POSTGRES_USER: act
          POSTGRES_PASSWORD: isolated_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U act -d act_tracking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ACT_TRACKING_ACCESS_TESTS: "1"
      DJANGO_SETTINGS_MODULE: myProject.settings.journey_report_tests
      SECRET_KEY: isolated-tracking-tests-never-use-in-production
      DEBUG: "False"
      DB_NAME: act_tracking_test
      DB_USER: act
      DB_PASSWORD: isolated_tracking_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: isolated-test-not-a-real-key
      TWILIO_VERIFY_SERVICE_SID: VA00000000000000000000000000000000
      GOOGLE_MAPS_API_KEY: isolated-test-not-a-real-key
      STRIPE_SECRET_KEY: sk_test_isolated_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_isolated_not_a_real_secret
      FIREBASE_CREDENTIALS_PATH: tests/no-firebase-credentials.json
      REDIS_URL: redis://127.0.0.1:1/0
      CELERY_BROKER_URL: memory://
      EMAIL_HOST: localhost
      EMAIL_PORT: "1"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: isolated-test-not-a-real-key
      ADMIN_EMAIL: admin@example.invalid
      APP_BASE_URL: https://api.example.invalid
      ACT_PUBLIC_WEBSITE_URL: https://website.example.invalid
      ACT_EMAIL_ASSETS_BASE_URL: https://api.example.invalid/static/email-assets
      N8N_ENABLED: "False"
    defaults:
      run:
        working-directory: act_backend-main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: act_backend-main/requirements.txt
      - name: Ensure GeoDjango can import its native libraries
        run: |
          if ! python -c 'from ctypes import CDLL; from ctypes.util import find_library; assert all(find_library(n) and CDLL(find_library(n)) for n in ("gdal", "geos_c"))'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libgdal34t64 libgeos-c1t64
          fi
      - run: pip install -r requirements.txt
      - name: Test preview and fare reuse with simulated directions
        run: python manage.py test apps.trips.tests.test_route_preview --verbosity 2 --noinput
