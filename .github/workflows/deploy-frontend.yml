name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy ACT frontend
    runs-on: self-hosted

    steps:
      - name: Deploy frontend on VPS
        shell: bash
        run: |
          set -euo pipefail

          cd /var/www/atg/front-end/airportandcitytransfer_repo
          git fetch origin
          git checkout main
          git pull --ff-only origin main

          rsync -a --delete \
            --exclude='.env' \
            --exclude='.next' \
            --exclude='node_modules' \
            /var/www/atg/front-end/airportandcitytransfer_repo/act_website-main/ \
            /var/www/atg/front-end/airportandcitytransfer/

          source ~/.nvm/nvm.sh
          cd /var/www/atg/front-end/airportandcitytransfer
          npm run build
          pm2 restart act --update-env
          pm2 save
          pm2 status
