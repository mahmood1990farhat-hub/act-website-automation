name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy ACT frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/atg/front-end/airportandcitytransfer_repo
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            rsync -a --delete \
              --exclude='.env' \
              --exclude='.next' \
              --exclude='node_modules' \
              /var/www/atg/front-end/airportandcitytransfer_repo/act_website-main/ \
              /var/www/atg/front-end/airportandcitytransfer/

            source ~/.nvm/nvm.sh
            cd /var/www/atg/front-end/airportandcitytransfer
            npm run build
            pm2 restart act --update-env
            pm2 save
            pm2 status
