name: Deploy ACT frontend

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact accepted 40-character Git commit SHA
        required: true

concurrency:
  group: act-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Deploy accepted ACT frontend
    runs-on: self-hosted
    environment: production

    steps:
      - name: Validate accepted SHA
        id: accepted_sha
        shell: bash
        env:
          ACCEPTED_SHA: "${{ inputs.commit_sha }}"
        run: |
          set -euo pipefail
          ACCEPTED_SHA="${ACCEPTED_SHA//[[:space:]]/}"
          grep -Eqx '[0-9a-f]{40}' <<<"$ACCEPTED_SHA"
          echo "accepted_sha=$ACCEPTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy exact accepted frontend commit
        shell: bash
        run: |
          set -euo pipefail

          repo=/var/www/atg/front-end/airportandcitytransfer_repo
          release="$RUNNER_TEMP/act-frontend-${{ github.run_id }}"
          cleanup() {
            git -C "$repo" worktree remove --force "$release" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git -C "$repo" fetch origin main
          git -C "$repo" cat-file -e "${{ steps.accepted_sha.outputs.accepted_sha }}^{commit}"
          git -C "$repo" merge-base --is-ancestor "${{ steps.accepted_sha.outputs.accepted_sha }}" origin/main

          rm -rf "$release"
          git -C "$repo" worktree add --detach "$release" "${{ steps.accepted_sha.outputs.accepted_sha }}"

          rsync -a --delete \
            --exclude='.env' \
            --exclude='.next' \
            --exclude='node_modules' \
            "$release/act_website-main/" \
            /var/www/atg/front-end/airportandcitytransfer/

          source ~/.nvm/nvm.sh
          cd /var/www/atg/front-end/airportandcitytransfer
          npm ci
          npm run build
          pm2 restart act --update-env
          pm2 save
          pm2 status
