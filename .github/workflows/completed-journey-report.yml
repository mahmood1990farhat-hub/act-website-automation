name: ACT completed journey report

"on":
  push:
    branches: [draft/completed-journey-report-20261123]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: act_tracking_test
          POSTGRES_USER: act
          POSTGRES_PASSWORD: isolated_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U act -d act_tracking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ACT_TRACKING_ACCESS_TESTS: "1"
      DJANGO_SETTINGS_MODULE: myProject.settings.journey_report_tests
      SECRET_KEY: isolated-tracking-tests-never-use-in-production
      DEBUG: "False"
      DB_NAME: act_tracking_test
      DB_USER: act
      DB_PASSWORD: isolated_tracking_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: isolated-test-not-a-real-key
      TWILIO_VERIFY_SERVICE_SID: VA00000000000000000000000000000000
      GOOGLE_MAPS_API_KEY: isolated-test-not-a-real-key
      STRIPE_SECRET_KEY: sk_test_isolated_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_isolated_not_a_real_secret
      FIREBASE_CREDENTIALS_PATH: tests/no-firebase-credentials.json
      REDIS_URL: redis://127.0.0.1:1/0
      CELERY_BROKER_URL: memory://
      EMAIL_HOST: localhost
      EMAIL_PORT: "1"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: isolated-test-not-a-real-key
      ADMIN_EMAIL: admin@example.invalid
      APP_BASE_URL: https://api.example.invalid
      ACT_PUBLIC_WEBSITE_URL: https://website.example.invalid
      ACT_EMAIL_ASSETS_BASE_URL: https://api.example.invalid/static/email-assets
      N8N_ENABLED: "False"
    defaults:
      run:
        working-directory: act_backend-main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify narrow source scope and source revision
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/draft/completed-journey-report-20261123
          mkdir -p journey-report-evidence
          test "$GITHUB_REPOSITORY" = mahmood1990farhat-hub/act-website-automation
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d77e896af9daca5a39b7a85d5b76c5821e008d23 HEAD
          git diff --check
          git rev-parse HEAD > journey-report-evidence/source-sha.txt
          git diff --name-only d77e896af9daca5a39b7a85d5b76c5821e008d23 HEAD > journey-report-evidence/changed-paths.txt
          while IFS= read -r path; do
            case "$path" in
              act_backend-main/apps/trips/models/trip.py|act_backend-main/apps/trips/migrations/0009_journey_timestamps.py|act_backend-main/apps/trips/serializers/trip.py|act_backend-main/apps/trips/views/start_trip.py|act_backend-main/apps/trips/views/end_trip.py|act_backend-main/apps/trips/views/driver_trips.py|act_backend-main/apps/trips/tests/test_journey_report.py|act_backend-main/apps/trips/tests/journey_report_test_urls.py|act_backend-main/myProject/settings/journey_report_tests.py|.github/workflows/completed-journey-report.yml) ;;
              *) echo "Unexpected source path: $path"; exit 1 ;;
            esac
          done < journey-report-evidence/changed-paths.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: act_backend-main/requirements.txt
      - name: Ensure GeoDjango runtime libraries
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee ../journey-report-evidence/native-libraries.txt) 2>&1
          if python - <<'PY'
          import ctypes
          from ctypes.util import find_library
          for name in ("gdal", "geos_c"):
              library = find_library(name)
              if not library:
                  raise SystemExit(1)
              ctypes.CDLL(library)
          print("Required GeoDjango runtime libraries are already loadable")
          PY
          then
            :
          else
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30 install -y --no-install-recommends libgdal34t64 libgeos-c1t64
          fi
          python - <<'PY'
          import ctypes
          from ctypes.util import find_library
          for name in ("gdal", "geos_c"):
              library = find_library(name)
              if not library:
                  raise SystemExit(f"Required GeoDjango library is missing: {name}")
              ctypes.CDLL(library)
              print(f"Loaded required runtime library: {name}")
          PY
      - name: Install unchanged backend dependencies
        run: pip install -r requirements.txt
      - name: Verify migration state and run journey report plus tracking access tests
        shell: bash
        run: |
          set -euo pipefail
          python --version > ../journey-report-evidence/python-version.txt
          pip freeze > ../journey-report-evidence/dependencies.txt
          python manage.py makemigrations trips --check --dry-run 2>&1 | tee ../journey-report-evidence/migration-state.txt
          python manage.py test apps.trips.tests.test_journey_report apps.trips.tests.test_tracking_access --verbosity 2 --noinput 2>&1 | tee ../journey-report-evidence/tests.txt
      - name: Preserve source and test evidence
        if: always()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- act_backend-main .github/workflows/completed-journey-report.yml
          sha256sum act_backend-main/apps/trips/models/trip.py act_backend-main/apps/trips/migrations/0009_journey_timestamps.py act_backend-main/apps/trips/serializers/trip.py act_backend-main/apps/trips/views/start_trip.py act_backend-main/apps/trips/views/end_trip.py act_backend-main/apps/trips/views/driver_trips.py act_backend-main/apps/trips/tests/test_journey_report.py act_backend-main/apps/trips/tests/journey_report_test_urls.py act_backend-main/myProject/settings/journey_report_tests.py .github/workflows/completed-journey-report.yml > journey-report-evidence/file-sha256.txt
      - name: Upload focused evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-completed-journey-report-${{ github.sha }}
          path: journey-report-evidence/
          if-no-files-found: error
