name: Deploy ACT backend
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Expected release SHA (diagnostic only; no deployment)
        required: true
      apply_migrations:
        description: Unused for read-only diagnostics
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: act-backend-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Check directory access and permitted recovery path
        shell: bash
        run: |
          set -uo pipefail
          namei -l /var/www/atg/atg-backend/current/.venv/bin/python || true
          stat -c '%A %U:%G %n' /var/www/atg/atg-backend/releases /var/www/atg/atg-backend/releases/20261002T155353Z-a111eb476795 /var/www/atg/atg-backend/releases/20260806T221753Z-5e12ad9c393b || true
          sudo -n -l || true
          fc-match 'DejaVu Sans' -f '%{family}\n' || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/usr/local/sbin/act-backend-deploy')
          try:
              lines=p.read_text().splitlines()
              for i,line in enumerate(lines,1):
                  if any(x in line for x in ('umask','chmod','chown','mktemp','mkdir','install -d')):
                      print(f'deploy-script:{i}: {line}')
          except PermissionError:
              print('Deployment script not readable by runner')
          PY
