name: Deploy ACT backend

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact accepted 40-character Git commit SHA
        required: true
      apply_migrations:
        description: Apply reviewed migrations after a verified pre-migration database backup
        type: boolean
        default: false

concurrency:
  group: act-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Validate accepted SHA
        shell: bash
        env:
          ACCEPTED_SHA: "${{ inputs.commit_sha }}"
        run: |
          set -euo pipefail
          grep -Eqx '[0-9a-f]{40}' <<<"$ACCEPTED_SHA"

      - name: Create and verify pre-migration database backup
        id: migration_backup
        if: ${{ inputs.apply_migrations }}
        shell: bash
        run: |
          set -euo pipefail
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null

          backup_dir="/var/www/atg/atg-backend/shared/backups"
          test -d "$backup_dir"
          test -w "$backup_dir"

          tmp_backup="$RUNNER_TEMP/act-pre-migration-${{ github.run_id }}.dump"
          final_name="act-pre-migration-${{ inputs.commit_sha }}-$(date -u +%Y%m%dT%H%M%SZ).dump"

          /var/www/atg/atg-backend/current/.venv/bin/python - "$tmp_backup" <<'PY'
          import os
          import subprocess
          import sys
          import environ

          target = sys.argv[1]
          env = environ.Env()
          environ.Env.read_env("/var/www/atg/atg-backend/shared/.env")

          db_name = env("DB_NAME")
          db_user = env("DB_USER")
          db_password = env("DB_PASSWORD")
          db_host = env("DB_HOST", default="localhost")
          db_port = env("DB_PORT", default="5432")

          child_env = os.environ.copy()
          child_env["PGPASSWORD"] = db_password
          subprocess.run(
              [
                  "pg_dump",
                  "--format=custom",
                  "--no-owner",
                  "--no-privileges",
                  "--host", db_host,
                  "--port", str(db_port),
                  "--username", db_user,
                  "--file", target,
                  db_name,
              ],
              check=True,
              env=child_env,
          )
          subprocess.run(
              ["pg_restore", "--list", target],
              check=True,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.PIPE,
          )
          subprocess.run(
              ["pg_restore", "--file", os.devnull, target],
              check=True,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.PIPE,
          )
          if os.path.getsize(target) <= 0:
              raise SystemExit("Database backup is empty")
          PY

          final_backup="$backup_dir/$final_name"
          install -m 0640 "$tmp_backup" "$final_backup"
          rm -f "$tmp_backup"
          test -s "$final_backup"
          pg_restore --list "$final_backup" >/dev/null
          pg_restore --file /dev/null "$final_backup"

          echo "backup_path=$final_backup" >> "$GITHUB_OUTPUT"
          echo "Verified pre-migration backup: $final_backup" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy exact accepted backend commit
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          args=("${{ inputs.commit_sha }}" --github-token-stdin)
          if [[ "${{ inputs.apply_migrations }}" == true ]]; then
            backup_path="${{ steps.migration_backup.outputs.backup_path }}"
            [[ -n "$backup_path" ]] || { echo "verified backup path missing" >&2; exit 1; }
            args+=(--migrate --verified-backup "$backup_path")
          fi
          printf '%s\n' "$GH_TOKEN" | sudo /usr/local/sbin/act-backend-deploy "${args[@]}" | tee "$RUNNER_TEMP/act-backend-deploy.log"

      - name: Deployment summary
        if: always()
        shell: bash
        run: tail -n 80 "$RUNNER_TEMP/act-backend-deploy.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
