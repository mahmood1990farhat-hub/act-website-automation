name: Deploy ACT backend
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Expected release SHA (diagnostic only; no deployment)
        required: true
      apply_migrations:
        description: Unused for read-only diagnostics
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: act-backend-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Verify deployed language paths and synthetic Arabic PDFs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          sudo -n /usr/bin/systemctl is-active act.service
          sudo -n /usr/bin/systemctl is-active act-celery-beat.service
          id
          cd /var/www/atg/atg-backend/current
          fc-match 'DejaVu Sans' -f '%{family}\n'
          export PYTHONDONTWRITEBYTECODE=1
          unset DJANGO_SETTINGS_MODULE
          .venv/bin/python -B - <<'PY'
          import ast, base64, hashlib, json, logging, os, sys, unittest
          from pathlib import Path
          from io import BytesIO
          root = Path.cwd().resolve()
          assert json.loads((root / "release.json").read_text())["git_sha"] == os.environ["EXPECTED_SHA"]
          from apps.trips.tests import test_customer_language as checks
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(checks))
          assert result.wasSuccessful()
          from django.conf import settings
          from weasyprint import HTML
          from apps.trips.services.customer_language import booking_language
          from apps.trips.services.customer_documents import render_arabic_document
          logo = root / "static/assets/act_logo.png"
          assert logo.is_file(), "Production logo missing"
          assert logo.read_bytes().startswith(b"\x89PNG"), "Logo is not a readable PNG"
          # Execute the deployed PDF function bodies with offline template settings.
          # Arabic branches use no database, Google Maps, payments or outgoing messages.
          source = ast.parse((root / "apps/trips/services/pdf_generator.py").read_text())
          names = {"generate_booking_confirmation_pdf", "generate_cancellation_confirmation_pdf"}
          module = ast.Module(body=[n for n in source.body if isinstance(n, ast.FunctionDef) and n.name in names], type_ignores=[])
          env = dict(Path=Path, BytesIO=BytesIO, settings=settings, HTML=HTML, booking_language=booking_language, render_arabic_document=render_arabic_document)
          exec(compile(module, "deployed_pdf_functions", "exec"), env)
          class FailOnRenderError(logging.Handler):
              def emit(self, record):
                  if record.levelno >= logging.ERROR:
                      raise RuntimeError(record.getMessage())
          logging.getLogger("weasyprint").addHandler(FailOnRenderError())
          trip = checks.sample("ar")
          trip.booking_details["additional_requirements"]["notes_to_driver"] = "Synthetic preview"
          for kind in ("booking", "cancellation"):
              data = env["generate_" + kind + "_confirmation_pdf"](trip).getvalue()
              assert data.startswith(b"%PDF-") and len(data) > 5000
              print("PDF_RESULT", kind, len(data), hashlib.sha256(data).hexdigest())
              encoded = base64.b64encode(data).decode()
              for i in range(0, len(encoded), 3000):
                  print("ACT_PDF_DATA_" + kind + ":" + encoded[i:i+3000])
          print("DEPLOYED_SYNTHETIC_PDF_CHECKS_PASSED")
          PY
          sudo -n /usr/bin/systemctl is-active act.service
          sudo -n /usr/bin/systemctl is-active act-celery-beat.service
