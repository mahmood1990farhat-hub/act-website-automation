name: Deploy ACT backend
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Expected release SHA (diagnostic only; no deployment)
        required: true
      apply_migrations:
        description: Unused for read-only diagnostics
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: act-backend-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Read service health and filtered startup failures
        shell: bash
        run: |
          set -uo pipefail
          for unit in act.service act-celery-beat.service; do
            systemctl show "$unit" -p ActiveState -p SubState -p Result -p ExecMainStatus -p User -p WorkingDirectory -p ExecStart
          done
          sudo -n journalctl -u act-celery-beat.service --since '2026-10-02 15:53:00 UTC' -n 120 --no-pager -o cat 2>/dev/null | python3 -c '
          import sys,re
          lines=sys.stdin.read().splitlines()
          for line in lines:
              if any(s in line.lower() for s in ("error","exception","permission denied","no such file","failed at step","cannot","traceback","celery","schedule","code=")):
                  line=re.sub(r"[a-zA-Z][a-zA-Z0-9+.-]*://[^\s]+","[REDACTED_URI]",line)
                  line=re.sub(r"(?i)(password|secret|token|api[_-]?key)\s*[=:]\s*\S+",r"\1=[REDACTED]",line)
                  print(line[:500])
          '
          fc-match 'DejaVu Sans' -f '%{family}\n' || true
