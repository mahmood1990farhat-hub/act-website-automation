name: Deploy ACT backend
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Expected release SHA (diagnostic only; no deployment)
        required: true
      apply_migrations:
        description: Unused for read-only diagnostics
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: act-backend-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Retrieve administrator-generated synthetic PDFs
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/systemctl is-active act.service
          sudo -n /usr/bin/systemctl is-active act-celery-beat.service
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          expected = "a111eb4767951a6c5b76a87cc9ce3e5ec1525337"
          dirs = sorted(Path("/tmp").glob("act-language-check-a111eb476795-*"))
          assert 1 <= len(dirs) <= 10, "Expected synthetic output directory not found or ambiguous"
          for folder in dirs:
              assert not folder.is_symlink() and folder.stat().st_uid == 0
              manifest = folder / "verification.json"
              assert not manifest.is_symlink() and manifest.stat().st_size < 10000
              report = json.loads(manifest.read_text())
              assert report["git_sha"] == expected and report["tests_passed"] == 5
              print("SYNTHETIC_OUTPUT", folder.name)
              for kind in ("booking", "cancellation"):
                  item = report["pdfs"][kind]
                  assert item["file"] == kind + "-ar.pdf"
                  p = folder / item["file"]
                  assert not p.is_symlink() and 5000 < p.stat().st_size < 2000000
                  data = p.read_bytes()
                  assert len(data) == item["bytes"] and hashlib.sha256(data).hexdigest() == item["sha256"]
                  print("PDF_RESULT", kind, len(data), item["sha256"])
                  encoded = base64.b64encode(data).decode()
                  for i in range(0, len(encoded), 3000):
                      print("ACT_PDF_DATA_" + kind + ":" + encoded[i:i+3000])
          print("SYNTHETIC_PDF_RETRIEVAL_VERIFIED")
          PY
