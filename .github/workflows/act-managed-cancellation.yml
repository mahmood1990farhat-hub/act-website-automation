name: ACT managed cancellation integration
"on":
  push:
    branches: [draft/act-managed-cancellation-20261025]
permissions:
  contents: read
concurrency:
  group: act-managed-cancellation-isolated
  cancel-in-progress: false
jobs:
  cancellation-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: act_cancel_flow_ci
          POSTGRES_USER: act
          POSTGRES_PASSWORD: isolated_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U act -d act_cancel_flow_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    env:
      ACT_E2E_ISOLATED: "1"
      SECRET_KEY: act-ci-cancellation-never-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: act_cancel_flow_ci
      DB_USER: act
      DB_PASSWORD: isolated_ci_only
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-not-production
      TWILIO_VERIFY_SERVICE_SID: VA00000000000000000000000000000000
      GOOGLE_MAPS_API_KEY: ci-not-production
      STRIPE_SECRET_KEY: sk_test_ci_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_real_secret
      CELERY_BROKER_URL: redis://127.0.0.1:6379/13
      N8N_ENABLED: "False"
      NOTIFICATION_FORCE_SYNC: "True"
      EMAIL_HOST: 127.0.0.1
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: ci-not-production
      ADMIN_EMAIL: admin@example.invalid
      APP_BASE_URL: http://127.0.0.1:8000
      ACT_PUBLIC_WEBSITE_URL: http://127.0.0.1:3001
      ACT_DRIVER_PRIVATE_UPLOAD_ROOT: /tmp/act-cancel-flow-ci
      ACT_NI_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard isolated environment and preserve checkout/calculator
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/draft/act-managed-cancellation-20261025
          git merge-base --is-ancestor 006bd4d68a326a948f2e430d19984fe43ad5a711 HEAD
          test "$DB_NAME" = act_cancel_flow_ci
          test "$DB_HOST" = 127.0.0.1
          test "$N8N_ENABLED" = False
          mkdir -p cancellation-evidence
          git diff --name-only 006bd4d68a326a948f2e430d19984fe43ad5a711 HEAD > cancellation-evidence/changed-paths.txt
          while read -r p; do
            case "$p" in
              act_backend-main/apps/payments/models.py|act_backend-main/apps/payments/booking_contracts.py|act_backend-main/apps/payments/refund_provider.py|act_backend-main/apps/payments/cancellation_flow.py|act_backend-main/apps/payments/cancellation_views.py|act_backend-main/apps/payments/migrations/0004_managed_cancellation_case.py|act_backend-main/apps/payments/test_cancellation_flow.py|act_backend-main/apps/payments/urls.py|act_backend-main/apps/trips/urls.py|act_backend-main/apps/trips/passenger_urls.py|act_backend-main/apps/trips/views/cancel.py|.github/workflows/act-managed-cancellation.yml|docs/review/ACT_MANAGED_CANCELLATION_2026-10-25.md) ;;
              *) echo "STOP: Unexpected path $p"; exit 1 ;;
            esac
          done < cancellation-evidence/changed-paths.txt
          test "$(git rev-parse HEAD:act_backend-main/apps/trips/services/cancellation_policy.py)" = 631eef05f96e4a4885540e937b42e7f9fa85f1ee
          test "$(git rev-parse HEAD:act_backend-main/apps/payments/checkout_terms.py)" = faff1311475432a68eaeba93beba9d3b989b20e7
          git rev-parse HEAD > cancellation-evidence/source-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: act_backend-main/requirements.txt
      - name: Install unchanged dependency constraints in disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin libgdal-dev libgeos-dev
          python -m pip install -q -r act_backend-main/requirements.txt
          python --version > cancellation-evidence/python-version.txt
          python -m pip freeze > cancellation-evidence/installed-versions.txt
      - name: Check additive migration and changed cancellation paths
        working-directory: act_backend-main
        shell: bash
        run: |
          set -Eeuo pipefail
          python manage.py makemigrations payments --check --dry-run 2>&1 | tee ../cancellation-evidence/migration-check.txt
          python manage.py test apps.payments.test_cancellation_flow --noinput --verbosity 2 2>&1 | tee ../cancellation-evidence/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: act-managed-cancellation-${{ github.sha }}
          path: cancellation-evidence/
          if-no-files-found: error
          retention-days: 14
