name: Inventory live pricing and trips migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: self-hosted
    steps:
      - name: Collect numbered migration files read-only
        shell: bash
        run: |
          set -euo pipefail

          live_root="/var/www/atg/atg-backend/backend"
          artifact_root="${RUNNER_TEMP}/pricing-trips-migration-inventory-${GITHUB_RUN_ID}"
          files_root="${artifact_root}/files"
          metadata_file="${artifact_root}/metadata.tsv"

          rm -rf "${artifact_root}"
          mkdir -p "${files_root}"
          printf 'relative_path\tabsolute_source_path\tsize_bytes\tmodified_utc\tsha256\n' > "${metadata_file}"

          count=0
          for relative_dir in apps/pricing/migrations apps/trips/migrations; do
            source_dir="${live_root}/${relative_dir}"
            if [[ ! -d "${source_dir}" ]]; then
              printf 'Missing migration directory: %s\n' "${source_dir}" >&2
              exit 1
            fi

            while IFS= read -r -d '' source_file; do
              filename="$(basename "${source_file}")"
              relative_path="${relative_dir}/${filename}"
              destination="${files_root}/${relative_path}"
              mkdir -p "$(dirname "${destination}")"
              cp -p -- "${source_file}" "${destination}"

              size_bytes="$(stat -c '%s' -- "${source_file}")"
              modified_utc="$(date -u -d "@$(stat -c '%Y' -- "${source_file}")" '+%Y-%m-%dT%H:%M:%SZ')"
              sha256="$(sha256sum -- "${source_file}" | awk '{print $1}')"
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "${relative_path}" "${source_file}" "${size_bytes}" "${modified_utc}" "${sha256}" \
                >> "${metadata_file}"
              count=$((count + 1))
            done < <(find "${source_dir}" -maxdepth 1 -type f -name '[0-9]*.py' -print0 | sort -z)
          done

          printf 'Collected %s numbered migration files.\n' "${count}"
          if [[ "${count}" -eq 0 ]]; then
            printf 'No numbered migration files were found.\n' >&2
            exit 1
          fi

      - name: Upload migration inventory
        uses: actions/upload-artifact@v4
        with:
          name: recovered-pricing-trips-migrations-${{ github.run_id }}
          path: ${{ runner.temp }}/pricing-trips-migration-inventory-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
