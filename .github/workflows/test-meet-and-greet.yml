name: Deploy reviewed backend release directory

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          ref: d30e13773e5dd2f1b816b09008b832aae1670235
          clean: true

      - name: Build, validate, switch, and verify release
        shell: bash
        run: |
          set -euo pipefail

          target_sha=d30e13773e5dd2f1b816b09008b832aae1670235
          old=/var/www/atg/atg-backend/backend
          release_root=/var/www/atg/atg-backend/releases/d30e13773e5d
          release="$release_root/backend"
          current=/var/www/atg/atg-backend/current
          python="$old/env/bin/python"
          report="$GITHUB_WORKSPACE/backend-release-deployment"
          pycache=/home/act/reconcile-work/release-pycache-${GITHUB_RUN_ID}
          restart_marker="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          switched=false
          current_existed=false
          previous_current=''

          rm -rf -- "$report" "$pycache"
          mkdir -p "$report" "$pycache"
          chmod 700 "$pycache"

          actual_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_sha" = "$target_sha"
          printf 'TARGET_SHA=%s\nCHECKOUT_SHA=%s\nSOURCE_VERIFIED=true\n' \
            "$target_sha" "$actual_sha" > "$report/source.txt"

          test -d "$old"
          test -x "$python"
          test -f "$old/.env"
          test -d "$old/media"
          test -d "$old/static"
          test ! -e "$release_root"

          sudo -n mkdir -p /var/www/atg/atg-backend/releases
          sudo -n mkdir -p "$release"
          sudo -n rsync -a --delete "$GITHUB_WORKSPACE/act_backend-main/" "$release/"
          printf '%s\n' "$target_sha" | sudo -n tee "$release_root/SOURCE_COMMIT" > /dev/null

          sudo -n rm -rf -- "$release/.env" "$release/media" "$release/static" "$release/celerybeat-schedule"
          sudo -n ln -s "$old/.env" "$release/.env"
          sudo -n ln -s "$old/media" "$release/media"
          sudo -n ln -s "$old/static" "$release/static"

          test "$(readlink -f "$release/.env")" = "$(readlink -f "$old/.env")"
          test "$(readlink -f "$release/media")" = "$(readlink -f "$old/media")"
          test "$(readlink -f "$release/static")" = "$(readlink -f "$old/static")"
          test ! -e "$release/env"
          test ! -e "$release/celerybeat-schedule"
          test ! -e "$release/db_models.py"
          printf '.env\t%s\nmedia\t%s\nstatic\t%s\nVIRTUALENV=%s\n' \
            "$(readlink "$release/.env")" "$(readlink "$release/media")" \
            "$(readlink "$release/static")" "$old/env" > "$report/symlinks.txt"

          manifest() {
            local root="$1"
            find "$root" -type f \
              ! -path "$root/.env" \
              ! -path "$root/media/*" \
              ! -path "$root/static/*" \
              ! -path "$root/celerybeat-schedule" \
              ! -path '*/__pycache__/*' \
              -printf '%P\0' | sort -z | while IFS= read -r -d '' relative; do
                printf '%s  %s\n' "$(sha256sum "$root/$relative" | awk '{print $1}')" "$relative"
              done
          }
          manifest "$GITHUB_WORKSPACE/act_backend-main" > "$report/source-manifest.txt"
          manifest "$release" > "$report/release-manifest.txt"
          cmp "$report/source-manifest.txt" "$report/release-manifest.txt"
          printf 'RELEASE_CONTENT_VERIFIED=true\nRELEASE_PATH=%s\n' "$release" > "$report/release.txt"

          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX="$pycache"
          cd "$release"
          "$python" -m compileall -q apps utils myProject
          "$python" manage.py check > "$report/pre-switch-django-check.txt" 2>&1
          "$python" manage.py showmigrations pricing > "$report/pre-switch-pricing-migrations.txt" 2>&1
          "$python" manage.py makemigrations --check --dry-run > "$report/pre-switch-makemigrations.txt" 2>&1
          "$python" - > "$report/pre-switch-url-check.txt" <<'PY'
          import django
          django.setup()
          from django.urls import get_resolver, resolve
          from myProject.asgi import application

          patterns = get_resolver().url_patterns
          if not patterns or application is None:
              raise SystemExit('Django URL/ASGI loading failed')
          expected = {
              '/api/payments/webhook/stripe/': 'stripe_webhook_view',
              '/api/trips/calculate-trip-cost/': 'CalculateTripCostView',
              '/api/trips/initiate-payment/': 'InitiatePaymentView',
              '/api/trips/initiate-guest-payment/': 'InitiateGuestPaymentView',
          }
          for path, expected_name in expected.items():
              match = resolve(path)
              actual = getattr(match.func, '__name__', match.func.__class__.__name__)
              if expected_name not in actual:
                  raise SystemExit(f'Unexpected resolver for {path}: {actual}')
              print(f'URL\t{path}\t{actual}')
          print('URLCONF_AND_ASGI_LOADED=true')
          PY

          "$python" - > "$report/pre-switch-database-check.txt" <<'PY'
          import django
          django.setup()
          from django.db import connection, transaction

          with transaction.atomic():
              with connection.cursor() as cursor:
                  cursor.execute('SET TRANSACTION READ ONLY')
                  cursor.execute('SELECT app, name FROM django_migrations ORDER BY app, name')
                  all_migrations = [list(row) for row in cursor.fetchall()]
                  pricing = [name for app, name in all_migrations if app == 'pricing']
                  expected = [
                      '0001_initial',
                      '0002_extra_service_fee',
                      '0003_extra_service_fee_priority',
                  ]
                  if pricing != expected:
                      raise SystemExit(f'Unexpected Pricing migrations: {pricing}')
                  cursor.execute('SELECT to_regclass(%s)', ['public.pricing_extraservicefee'])
                  if cursor.fetchone()[0] is None:
                      raise SystemExit('pricing_extraservicefee is missing')
          import json
          with open('all-migrations-before.json', 'w', encoding='utf-8') as handle:
              json.dump(all_migrations, handle)
          print('PRICING_MIGRATIONS=' + ','.join(pricing))
          print('EXTRA_SERVICE_TABLE_EXISTS=true')
          print('DATABASE_READ_ONLY_CHECK=true')
          PY
          sudo -n mv "$release/all-migrations-before.json" "$report/all-migrations-before.json"

          pre_socket_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --unix-socket /run/act.sock http://localhost/api/auth/login/ || true)"
          case "$pre_socket_code" in 2*|3*|4*) ;; *) echo "Pre-switch backend health failed: $pre_socket_code" >&2; exit 30;; esac
          printf 'PRE_SWITCH_SOCKET_HTTP=%s\n' "$pre_socket_code" > "$report/pre-switch-health.txt"

          mapfile -t units < <(
            systemctl list-units --all --type=service --no-legend --plain | awk '{print $1}' | while read -r unit; do
              properties="$(systemctl show "$unit" --property=WorkingDirectory,ExecStart --value 2>/dev/null || true)"
              if grep -Fq "$old" <<<"$properties"; then
                printf '%s\n' "$unit"
              fi
            done | sort -u
          )
          test "${#units[@]}" -gt 0
          printf '%s\n' "${units[@]}" > "$report/affected-units.txt"

          for unit in "${units[@]}"; do
            systemctl show "$unit" \
              --property=Id,LoadState,ActiveState,SubState,User,Group,WorkingDirectory,ExecStart,FragmentPath \
              >> "$report/unit-config-before.txt"
            working="$(systemctl show "$unit" --property=WorkingDirectory --value)"
            test "$working" = "$old"
            dropin="/etc/systemd/system/${unit}.d/90-act-release.conf"
            test ! -e "$dropin"
          done

          if test -L "$current" || test -e "$current"; then
            current_existed=true
            previous_current="$(readlink "$current")"
            test -n "$previous_current"
          fi
          printf 'CURRENT_EXISTED=%s\nPREVIOUS_CURRENT=%s\n' "$current_existed" "$previous_current" \
            > "$report/current-before.txt"

          rollback() {
            set +e
            if test "$switched" = true; then
              if test "$current_existed" = true; then
                sudo -n ln -sfn "$previous_current" "$current"
              else
                sudo -n rm -f "$current"
              fi
              for unit in "${units[@]}"; do
                sudo -n rm -f "/etc/systemd/system/${unit}.d/90-act-release.conf"
              done
              sudo -n systemctl daemon-reload
              for unit in "${units[@]}"; do
                sudo -n systemctl restart "$unit"
              done
              printf 'ROLLBACK_EXECUTED=true\n' > "$report/rollback.txt"
            fi
          }
          trap rollback ERR

          sudo -n ln -sfn "$release" "$current"
          for unit in "${units[@]}"; do
            dropin_dir="/etc/systemd/system/${unit}.d"
            sudo -n mkdir -p "$dropin_dir"
            printf '[Service]\nWorkingDirectory=%s\n' "$current" | \
              sudo -n tee "$dropin_dir/90-act-release.conf" > /dev/null
          done
          switched=true
          sudo -n systemctl daemon-reload
          for unit in "${units[@]}"; do
            sudo -n systemctl restart "$unit"
          done

          for unit in "${units[@]}"; do
            test "$(systemctl is-active "$unit")" = active
            test "$(systemctl show "$unit" --property=WorkingDirectory --value)" = "$current"
            systemctl show "$unit" --property=Id,ActiveState,SubState,WorkingDirectory,ExecStart \
              >> "$report/unit-config-after.txt"
          done

          cd "$current"
          "$python" manage.py check > "$report/post-switch-django-check.txt" 2>&1
          "$python" manage.py showmigrations pricing > "$report/post-switch-pricing-migrations.txt" 2>&1
          "$python" - "$report/all-migrations-before.json" > "$report/post-switch-database-check.txt" <<'PY'
          import json
          import sys
          import django
          django.setup()
          from django.db import connection, transaction

          with open(sys.argv[1], encoding='utf-8') as handle:
              before = json.load(handle)
          with transaction.atomic():
              with connection.cursor() as cursor:
                  cursor.execute('SET TRANSACTION READ ONLY')
                  cursor.execute('SELECT app, name FROM django_migrations ORDER BY app, name')
                  after = [list(row) for row in cursor.fetchall()]
                  if after != before:
                      raise SystemExit('Unexpected migration record change during deployment')
                  pricing = [name for app, name in after if app == 'pricing']
                  expected = [
                      '0001_initial',
                      '0002_extra_service_fee',
                      '0003_extra_service_fee_priority',
                  ]
                  if pricing != expected:
                      raise SystemExit(f'Unexpected Pricing migrations: {pricing}')
          print('MIGRATION_RECORDS_UNCHANGED=true')
          print('PRICING_MIGRATIONS=' + ','.join(pricing))
          PY

          socket_health="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --unix-socket /run/act.sock http://localhost/api/auth/login/)"
          public_health="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            https://airportandcitytransfer.com/api/auth/login/)"
          quote_options="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS --unix-socket /run/act.sock http://localhost/api/trips/calculate-trip-cost/)"
          extra_services="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --unix-socket /run/act.sock http://localhost/api/pricing/extra-services/)"
          for code in "$socket_health" "$public_health" "$quote_options" "$extra_services"; do
            case "$code" in 2*|3*|4*) ;; *) echo "Post-switch health failed: $code" >&2; false;; esac
          done
          printf 'SOCKET_HEALTH_HTTP=%s\nPUBLIC_HEALTH_HTTP=%s\nQUOTE_OPTIONS_HTTP=%s\nEXTRA_SERVICES_HTTP=%s\n' \
            "$socket_health" "$public_health" "$quote_options" "$extra_services" \
            > "$report/post-switch-health.txt"

          : > "$report/recent-log-findings.txt"
          for unit in "${units[@]}"; do
            log_file="$report/${unit//[^A-Za-z0-9_.-]/_}-recent-errors.txt"
            sudo -n journalctl -u "$unit" --since "$restart_marker" --no-pager --output=short-iso \
              | grep -Ei 'error|exception|traceback|critical|failed' \
              | sed -E \
                  -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[REDACTED_EMAIL]/g' \
                  -e 's/(pi_|sk_|pk_|in_)[A-Za-z0-9_]+/[REDACTED_ID]/g' \
              > "$log_file" || true
            count="$(wc -l < "$log_file")"
            printf '%s\tERROR_PATTERN_LINES=%s\n' "$unit" "$count" >> "$report/recent-log-findings.txt"
          done

          printf 'RELEASE_PATH=%s\nCURRENT_TARGET=%s\nRESTART_TIMESTAMP=%s\n' \
            "$release" "$(readlink "$current")" "$restart_marker" > "$report/deployment.txt"
          printf 'OLD_CHECKOUT_MODIFIED=false\nMIGRATIONS_RUN=false\nPRODUCTION_DATA_CHANGED=false\nMEET_AND_GREET_SEEDED=false\n' \
            > "$report/safety.txt"
          printf 'ROLLBACK_EXECUTED=false\nROLLBACK_CURRENT_TARGET=%s\n' "$old" > "$report/rollback.txt"
          switched=false

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-deployment-${{ github.run_id }}
          path: backend-release-deployment/
          if-no-files-found: error
          retention-days: 30
