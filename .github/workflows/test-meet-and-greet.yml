name: Retrieve sanitized migration validation failure

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Sanitize existing test failure log
        shell: bash
        run: |
          set -euo pipefail
          source_log=/home/act/reconcile-work/restored-migrations-30491672218/private-logs/tests.log
          report="$RUNNER_TEMP/restored-migration-test-failure-${GITHUB_RUN_ID}"
          test -f "$source_log"
          mkdir -p "$report"
          sed -E \
            -e '/Invalid line:/d' \
            -e '/PASSWORD|SECRET|TOKEN|API_KEY|DATABASE_URL|PRIVATE_KEY/Id' \
            -e 's#(/[^ ]*\.env[^ ]*)#[REDACTED_ENV_PATH]#g' \
            "$source_log" > "$report/tests.txt"

      - name: Upload sanitized failure report
        uses: actions/upload-artifact@v4
        with:
          name: restored-migration-test-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/restored-migration-test-failure-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 7
