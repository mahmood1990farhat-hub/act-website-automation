name: Cleanup Isolated Migration Validation

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Remove run-specific isolated databases and collect failure report
        shell: bash
        run: |
          set -euo pipefail

          live=/var/www/atg/atg-backend/backend
          python="$live/env/bin/python"
          previous_work=/home/act/reconcile-work/complete-migration-30484096725
          report="$RUNNER_TEMP/migration-cleanup-${GITHUB_RUN_ID}"
          raw="$report/private"
          mkdir -p "$raw"
          chmod 700 "$report" "$raw"

          sanitize() {
            sed -E \
              -e '/Invalid line:/d' \
              -e '/PASSWORD|SECRET|TOKEN|API_KEY|DATABASE_URL|PRIVATE_KEY/Id' \
              -e 's#(/[^ ]*\.env[^ ]*)#[REDACTED_ENV_PATH]#g' \
              "$1" > "$2"
          }

          cd "$live"
          "$python" - \
            act_migration_validation_30484096725 \
            act_migration_validation_30484096725_tests \
            > "$raw/cleanup.log" 2>&1 <<'PY'
          import django
          import re
          import sys
          django.setup()
          from django.db import connection

          names = list(sys.argv[1:])
          if not names or any(
              not re.fullmatch(r'act_migration_validation_[0-9]+(?:_tests)?', name)
              for name in names
          ):
              raise SystemExit('Unsafe isolated database name')

          with connection._nodb_cursor() as cursor:
              for name in names:
                  cursor.execute(
                      'SELECT pg_terminate_backend(pid) FROM pg_stat_activity '
                      'WHERE datname = %s AND pid <> pg_backend_pid()',
                      [name],
                  )
                  cursor.execute(
                      f'DROP DATABASE IF EXISTS {connection.ops.quote_name(name)}'
                  )
              cursor.execute(
                  'SELECT datname FROM pg_database WHERE datname = ANY(%s)',
                  [names],
              )
              remaining = [row[0] for row in cursor.fetchall()]

          if remaining:
              raise SystemExit('Isolated databases remain after cleanup')
          print('ISOLATED_DATABASES_REMOVED=true')
          PY

          sanitize "$raw/cleanup.log" "$report/cleanup.txt"

          source_log="$previous_work/private-logs/makemigrations.log"
          if [[ -f "$source_log" ]]; then
            sanitize "$source_log" "$report/makemigrations-check.txt"
          else
            echo 'Original makemigrations log was not found.' > "$report/makemigrations-check.txt"
          fi

          rm -rf -- "$raw"
          cat "$report/cleanup.txt"

          echo "artifact_path=$report" >> "$GITHUB_OUTPUT"

      - name: Upload cleanup and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-validation-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/migration-cleanup-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 7
