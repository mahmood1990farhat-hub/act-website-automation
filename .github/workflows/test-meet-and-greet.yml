name: Validate production Pricing migration history

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: codex/validate-pricing-migration-history
          clean: true

      - name: Run isolated migration validation
        shell: bash
        run: |
          set -euo pipefail

          live=/var/www/atg/atg-backend/backend
          python="$live/env/bin/python"
          work="/home/act/reconcile-work/pricing-history-${GITHUB_RUN_ID}"
          backend="$work/backend"
          report="$GITHUB_WORKSPACE/pricing-history-report"
          migration_db="act_pricing_history_${GITHUB_RUN_ID}"
          test_db="${migration_db}_tests"
          settings_file="$backend/myProject/ci_pricing_history_settings.py"

          rm -rf -- "$work" "$report"
          mkdir -p "$backend" "$report"
          chmod 700 "$work"
          cp -a "$GITHUB_WORKSPACE/act_backend-main/." "$backend/"

          expected=94c1e7405de61fe0187d3bac6c2bbc27c5d54d1e2f3e95a740036d9f88ebe964
          actual="$(sha256sum "$backend/apps/pricing/migrations/0001_initial.py" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf 'PRICING_0001_SHA256=%s\nHASH_VERIFIED=true\n' "$actual" > "$report/hash.txt"

          ln -s "$live/.env" "$backend/.env"
          cat > "$settings_file" <<'PY'
          import os
          from .settings import *
          DATABASES['default']['NAME'] = os.environ['CI_MIGRATION_DB_NAME']
          DATABASES['default'].setdefault('TEST', {})['NAME'] = os.environ['CI_TEST_DB_NAME']
          PY

          cleanup() {
            set +e
            cd "$backend" 2>/dev/null || true
            DJANGO_SETTINGS_MODULE=myProject.settings "$python" - "$migration_db" "$test_db" > "$report/cleanup.txt" 2>&1 <<'PY'
          import django
          import re
          import sys
          django.setup()
          from django.db import connection

          names = sys.argv[1:]
          pattern = r'act_pricing_history_[0-9]+(?:_tests)?'
          if any(not re.fullmatch(pattern, name) for name in names):
              raise SystemExit('Unsafe isolated database name')
          with connection._nodb_cursor() as cursor:
              for name in names:
                  cursor.execute(
                      'SELECT pg_terminate_backend(pid) FROM pg_stat_activity '
                      'WHERE datname = %s AND pid <> pg_backend_pid()',
                      [name],
                  )
                  cursor.execute(f'DROP DATABASE IF EXISTS {connection.ops.quote_name(name)}')
              cursor.execute('SELECT datname FROM pg_database WHERE datname = ANY(%s)', [names])
              remaining = [row[0] for row in cursor.fetchall()]
          if remaining:
              raise SystemExit(f'Isolated databases remain: {remaining}')
          print('ISOLATED_DATABASES_REMOVED=true')
          PY
            status=$?
            rm -f "$backend/.env" "$settings_file"
            find "$backend" -type d -name __pycache__ -prune -exec rm -rf {} + || true
            printf 'CLEANUP_EXIT=%s\n' "$status" >> "$report/cleanup.txt"
            return "$status"
          }
          trap cleanup EXIT

          cd "$backend"
          export CI_MIGRATION_DB_NAME="$migration_db"
          export CI_TEST_DB_NAME="$test_db"

          "$python" -m compileall -q apps utils myProject
          printf 'PYTHON_COMPILE=true\nPYTHON_EXECUTABLE=%s\n' "$python" > "$report/python.txt"

          DJANGO_SETTINGS_MODULE=myProject.settings "$python" - > "$report/migration-graph.txt" <<'PY'
          import django
          django.setup()
          from django.db.migrations.loader import MigrationLoader
          loader = MigrationLoader(None, ignore_no_migrations=False)
          loader.graph.ensure_not_cyclic()
          print(f'MIGRATION_NODE_COUNT={len(loader.graph.nodes)}')
          print('MIGRATION_LEAVES=' + ','.join(f'{a}.{n}' for a, n in sorted(loader.graph.leaf_nodes())))
          PY

          DJANGO_SETTINGS_MODULE=myProject.settings "$python" - "$migration_db" > "$report/create-database.txt" <<'PY'
          import django
          import re
          import sys
          django.setup()
          from django.db import connection

          requested = sys.argv[1]
          production = str(connection.settings_dict.get('NAME') or '')
          if not re.fullmatch(r'act_pricing_history_[0-9]+', requested) or requested == production:
              raise SystemExit('Unsafe isolated database name')
          connection.settings_dict.setdefault('TEST', {})['NAME'] = requested
          created = connection.creation._create_test_db(verbosity=1, autoclobber=True, keepdb=False)
          print(f'ISOLATED_MIGRATION_DATABASE={created}')
          print(f'PRODUCTION_DATABASE_UNCHANGED={created != production}')
          PY

          "$python" manage.py check --settings myProject.ci_pricing_history_settings > "$report/django-check.txt" 2>&1
          "$python" manage.py showmigrations --plan --settings myProject.ci_pricing_history_settings > "$report/showmigrations-plan.txt" 2>&1
          "$python" manage.py makemigrations --check --dry-run --settings myProject.ci_pricing_history_settings > "$report/makemigrations-check.txt" 2>&1
          "$python" manage.py migrate --noinput --settings myProject.ci_pricing_history_settings > "$report/migrate.txt" 2>&1
          "$python" manage.py showmigrations --plan --settings myProject.ci_pricing_history_settings > "$report/showmigrations-after.txt" 2>&1
          "$python" manage.py test \
            apps.pricing.tests.test_extra_service_resolver \
            apps.pricing.tests.test_pricing_engine \
            apps.pricing.tests.test_airport_resolver \
            apps.pricing.tests.test_integration \
            apps.trips.tests.test_meet_and_greet_pricing \
            --settings myProject.ci_pricing_history_settings \
            --noinput --verbosity=2 > "$report/tests.txt" 2>&1

          printf 'LIVE_SOURCE_MODIFIED=false\nPRODUCTION_MIGRATIONS_RUN=false\nSERVICES_RESTARTED=false\n' > "$report/safety.txt"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-history-validation-${{ github.run_id }}
          path: pricing-history-report/
          if-no-files-found: error
          retention-days: 7
