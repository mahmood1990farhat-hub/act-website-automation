name: Inspect production pricing migration state

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read Pricing migration and schema metadata
        shell: bash
        run: |
          set -euo pipefail
          live=/var/www/atg/atg-backend/backend
          python="$live/env/bin/python"
          report="$RUNNER_TEMP/pricing-migration-state-${GITHUB_RUN_ID}"
          mkdir -p "$report"
          chmod 700 "$report"

          cd "$live"
          DJANGO_SETTINGS_MODULE=myProject.settings "$python" - "$report/state.txt" <<'PY'
          import django
          import sys

          django.setup()
          from django.db import connection, transaction

          output = []
          with transaction.atomic():
              with connection.cursor() as cursor:
                  cursor.execute('SET TRANSACTION READ ONLY')
                  cursor.execute('SELECT current_schema()')
                  schema = cursor.fetchone()[0]
                  output.append(f'SCHEMA\t{schema}')

                  cursor.execute(
                      "SELECT app, name, applied AT TIME ZONE 'UTC' "
                      "FROM django_migrations WHERE app = %s ORDER BY applied, name",
                      ['pricing'],
                  )
                  for app, name, applied in cursor.fetchall():
                      output.append(f'MIGRATION\t{app}\t{name}\t{applied.isoformat()}Z')

                  cursor.execute(
                      'SELECT table_name FROM information_schema.tables '
                      'WHERE table_schema = %s AND table_name LIKE %s ORDER BY table_name',
                      [schema, 'pricing_%'],
                  )
                  tables = [row[0] for row in cursor.fetchall()]
                  for table in tables:
                      output.append(f'TABLE\t{table}')

                  target = 'pricing_extraservicefee'
                  output.append(f'EXTRA_SERVICE_TABLE_EXISTS\t{str(target in tables).lower()}')
                  if target in tables:
                      cursor.execute(
                          'SELECT column_name, data_type, is_nullable, column_default '
                          'FROM information_schema.columns '
                          'WHERE table_schema = %s AND table_name = %s ORDER BY ordinal_position',
                          [schema, target],
                      )
                      for name, data_type, nullable, default in cursor.fetchall():
                          safe_default = default or ''
                          output.append(
                              f'COLUMN\t{target}\t{name}\t{data_type}\t{nullable}\t{safe_default}'
                          )

                      cursor.execute(
                          'SELECT indexname, indexdef FROM pg_indexes '
                          'WHERE schemaname = %s AND tablename = %s ORDER BY indexname',
                          [schema, target],
                      )
                      for name, definition in cursor.fetchall():
                          output.append(f'INDEX\t{target}\t{name}\t{definition}')

          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              handle.write('\n'.join(output) + '\n')
          print('READ_ONLY_INSPECTION_COMPLETE=true')
          PY

      - name: Upload Pricing state report
        uses: actions/upload-artifact@v4
        with:
          name: pricing-migration-state-${{ github.run_id }}
          path: ${{ runner.temp }}/pricing-migration-state-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 7
