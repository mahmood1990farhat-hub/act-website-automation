name: Validate Restored Backend Migration History

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Check out validation harness
        uses: actions/checkout@v4
        with:
          ref: codex/recover-live-migration-files
          clean: true

      - name: Validate recovered migrations in isolation
        shell: bash
        run: |
          set -euo pipefail

          live=/var/www/atg/atg-backend/backend
          python="$live/env/bin/python"
          work="/home/act/reconcile-work/migration-history-${GITHUB_RUN_ID}"
          proposal="$work/backend"
          report="$GITHUB_WORKSPACE/migration-validation-report"
          migration_db="act_migration_validation_${GITHUB_RUN_ID}"

          mkdir -p "$work" "$report"
          chmod 700 "$work"
          cp -a "$GITHUB_WORKSPACE/act_backend-main/." "$proposal/"

          declare -A expected=(
            ["apps/payments/migrations/0001_initial.py"]="01d118e0a161d8868917868ef65c46803ebf9bf3beab1aeb224dc589bdc4c8e8"
            ["apps/trips/migrations/0001_initial.py"]="90f0dc7c58bbcf88f8fbececcbdddfff0873e0a66acab4e8d6aa7bdad0ccc6fd"
            ["apps/trips/migrations/0002_alter_trip_status.py"]="7641e0eda881e000c5b907b28d4d7eb0e7afd7f2ccfe266aa70474044359ef06"
            ["apps/trips/migrations/0003_trip_booking_confirmation_pdf_and_more.py"]="ca494b6ad9691dcddbaec9bef2461361fb244e679ea2be99e2efc2fd6ae5bc59"
          )

          printf 'path\tsha256\n' > "$report/hashes.tsv"
          for relative in "${!expected[@]}"; do
            source="$live/$relative"
            destination="$proposal/$relative"
            test -f "$source"
            actual="$(sha256sum "$source" | awk '{print $1}')"
            test "$actual" = "${expected[$relative]}"
            cp -- "$source" "$destination"
            copied="$(sha256sum "$destination" | awk '{print $1}')"
            test "$copied" = "${expected[$relative]}"
            printf '%s\t%s\n' "$relative" "$copied" >> "$report/hashes.tsv"
          done

          ln -s "$live/.env" "$proposal/.env"
          settings_file="$proposal/myProject/ci_migration_validation_settings.py"
          cat > "$settings_file" <<'PY'
          import os
          from .settings import *
          DATABASES["default"]["NAME"] = os.environ["CI_MIGRATION_DB_NAME"]
          DATABASES["default"].setdefault("TEST", {})["NAME"] = (
              os.environ["CI_MIGRATION_DB_NAME"] + "_tests"
          )
          PY

          cleanup() {
            set +e
            DJANGO_SETTINGS_MODULE=myProject.settings \
              "$python" - "$migration_db" <<'PY'
          import django
          import sys
          django.setup()
          from django.db import connection
          connection.creation._destroy_test_db(sys.argv[1], verbosity=0)
          PY
            rm -f "$proposal/.env" "$settings_file"
            find "$proposal" -type d -name __pycache__ -prune -exec rm -rf {} +
          }
          trap cleanup EXIT

          cd "$proposal"
          export CI_MIGRATION_DB_NAME="$migration_db"

          DJANGO_SETTINGS_MODULE=myProject.settings \
            "$python" - "$migration_db" <<'PY'
          import django
          import sys
          django.setup()
          from django.db import connection
          production = str(connection.settings_dict.get("NAME") or "")
          requested = sys.argv[1]
          if not requested or requested == production or not requested.startswith(
              "act_migration_validation_"
          ):
              raise SystemExit("Unsafe isolated migration database name")
          connection.settings_dict.setdefault("TEST", {})["NAME"] = requested
          connection.creation._create_test_db(
              verbosity=1,
              autoclobber=True,
              keepdb=False,
          )
          print(f"ISOLATED_MIGRATION_DATABASE={requested}")
          print(f"PRODUCTION_DATABASE_UNCHANGED={production != requested}")
          PY

          "$python" -m py_compile \
            apps/payments/migrations/0001_initial.py \
            apps/payments/migrations/0002_booking_details_persistence.py \
            apps/trips/migrations/0001_initial.py \
            apps/trips/migrations/0002_alter_trip_status.py \
            apps/trips/migrations/0003_trip_booking_confirmation_pdf_and_more.py \
            apps/trips/migrations/0004_booking_details_persistence.py
          "$python" manage.py check \
            --settings myProject.ci_migration_validation_settings \
            | tee "$report/django-check.txt"
          "$python" manage.py migrate --noinput \
            --settings myProject.ci_migration_validation_settings \
            | tee "$report/migrate-fresh-database.txt"
          "$python" manage.py showmigrations \
            --settings myProject.ci_migration_validation_settings \
            | tee "$report/showmigrations.txt"
          "$python" manage.py makemigrations --check --dry-run \
            --settings myProject.ci_migration_validation_settings \
            | tee "$report/makemigrations-check.txt"

          "$python" manage.py test \
            apps.payments.test_urls \
            apps.payments.tests \
            apps.pricing.tests.test_extra_service_resolver \
            apps.pricing.tests.test_pricing_engine \
            apps.pricing.tests.test_airport_resolver \
            apps.pricing.tests.test_integration \
            apps.trips.tests.test_meet_and_greet_pricing \
            --settings myProject.ci_migration_validation_settings \
            --noinput \
            --verbosity=2 \
            | tee "$report/tests.txt"

          echo "LIVE_SOURCE_MODIFIED=false" | tee "$report/safety.txt"
          echo "PRODUCTION_MIGRATIONS_RUN=false" | tee -a "$report/safety.txt"
          echo "SERVICES_RESTARTED=false" | tee -a "$report/safety.txt"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-history-validation-${{ github.run_id }}
          path: migration-validation-report/
          if-no-files-found: warn
          retention-days: 7
