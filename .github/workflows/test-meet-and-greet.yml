name: Validate PR 63 cost breakdown

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/cost-breakdown-correction-v1
          clean: true

      - name: Validate backend with isolated database
        shell: bash
        run: |
          set -euo pipefail

          live=/var/www/atg/atg-backend/backend
          python="$live/env/bin/python"
          backend="$GITHUB_WORKSPACE/act_backend-main"
          test_db="test_act_pr63_${GITHUB_RUN_ID}"
          settings_file="$backend/myProject/ci_pr63_settings.py"

          test -x "$python"
          test -f "$live/.env"
          ln -s "$live/.env" "$backend/.env"

          cat > "$settings_file" <<'PY'
          import os
          from .settings import *

          test_name = os.environ['CI_TEST_DB_NAME']
          production_name = str(DATABASES['default'].get('NAME') or '')
          if test_name == production_name or not test_name.startswith('test_act_pr63_'):
              raise RuntimeError('Unsafe isolated test database name')
          DATABASES['default'].setdefault('TEST', {})['NAME'] = test_name
          PY

          cleanup() {
            set +e
            cd "$backend"
            DJANGO_SETTINGS_MODULE=myProject.settings "$python" - "$test_db" <<'PY'
          import django
          import re
          import sys

          django.setup()
          from django.db import connection

          name = sys.argv[1]
          production = str(connection.settings_dict.get('NAME') or '')
          if not re.fullmatch(r'test_act_pr63_[0-9]+', name) or name == production:
              raise SystemExit('Unsafe cleanup database name')
          with connection._nodb_cursor() as cursor:
              cursor.execute(
                  'SELECT pg_terminate_backend(pid) FROM pg_stat_activity '
                  'WHERE datname = %s AND pid <> pg_backend_pid()',
                  [name],
              )
              cursor.execute(f'DROP DATABASE IF EXISTS {connection.ops.quote_name(name)}')
              cursor.execute('SELECT 1 FROM pg_database WHERE datname = %s', [name])
              if cursor.fetchone():
                  raise SystemExit('Isolated test database still exists')
          print(f'ISOLATED_DATABASE_REMOVED={name}')
          PY
            rm -f "$backend/.env" "$settings_file"
          }
          trap cleanup EXIT

          cd "$backend"
          export CI_TEST_DB_NAME="$test_db"
          echo "PYTHON_EXECUTABLE=$python"
          echo "ISOLATED_TEST_DATABASE=$test_db"
          "$python" -m compileall -q apps utils myProject
          "$python" manage.py check --settings myProject.ci_pr63_settings
          "$python" manage.py test \
            apps.payments.test_urls \
            apps.payments.tests \
            apps.pricing.tests.test_extra_service_resolver \
            apps.pricing.tests.test_pricing_engine \
            apps.pricing.tests.test_airport_resolver \
            apps.pricing.tests.test_integration \
            apps.trips.tests.test_meet_and_greet_pricing \
            --settings myProject.ci_pr63_settings \
            --noinput \
            --verbosity=2

      - name: Validate frontend production build
        shell: bash
        working-directory: act_website-main
        run: |
          set -euo pipefail
          npm ci
          npm run build -- --webpack

      - name: Validate diff whitespace
        shell: bash
        run: git diff --check origin/main...HEAD
