name: Validate Clearpay checkout

on:
  workflow_dispatch:
  push:
    branches:
      - codex/clearpay-checkout-v1

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: act_ci
          POSTGRES_USER: act_ci
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U act_ci -d act_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      DB_NAME: act_ci
      DB_USER: act_ci
      DB_PASSWORD: test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TWILIO_ACCOUNT_SID: ci-placeholder
      TWILIO_AUTH_TOKEN: ci-placeholder
      TWILIO_VERIFY_SERVICE_SID: ci-placeholder
      GOOGLE_MAPS_API_KEY: AIza00000000000000000000000000000000000
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-placeholder
      ADMIN_EMAIL: admin@example.com
      NOTIFICATION_FORCE_SYNC: "True"
    steps:
      - name: Check out Clearpay branch
        uses: actions/checkout@v4
        with:
          ref: codex/clearpay-checkout-v1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: act_backend-main/requirements.txt

      - name: Install GIS runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin libgdal-dev

      - name: Install backend dependencies
        working-directory: act_backend-main
        run: pip install -r requirements.txt

      - name: Run isolated Django validation
        working-directory: act_backend-main
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/clearpay-django-validation.log") 2>&1
          test_db="test_act_clearpay_${GITHUB_RUN_ID}"
          settings_file="myProject/ci_clearpay_settings.py"

          cat > "$settings_file" <<'PY'
          import os
          from .settings import *

          test_name = os.environ['CI_TEST_DB_NAME']
          production_name = str(DATABASES['default'].get('NAME') or '')
          if test_name == production_name or not test_name.startswith('test_act_clearpay_'):
              raise RuntimeError('Unsafe isolated test database name')
          DATABASES['default'].setdefault('TEST', {})['NAME'] = test_name
          PY
          trap 'rm -f "$settings_file"' EXIT

          export CI_TEST_DB_NAME="$test_db"
          echo "ISOLATED_TEST_DATABASE=$test_db"
          python manage.py check --settings myProject.ci_clearpay_settings
          python manage.py test \
            apps.payments.test_urls \
            apps.payments.test_payment_methods \
            apps.payments.tests \
            apps.trips.tests.test_meet_and_greet_pricing \
            apps.pricing.tests.test_extra_service_resolver \
            apps.pricing.tests.test_pricing_engine \
            --settings myProject.ci_clearpay_settings \
            --noinput \
            --verbosity=2

          if PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d postgres -Atc \
            "SELECT 1 FROM pg_database WHERE datname = '$test_db'" | grep -q 1; then
            echo "Isolated test database was not destroyed" >&2
            exit 1
          fi
          echo "ISOLATED_DATABASE_REMOVED=$test_db"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clearpay-django-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/clearpay-django-validation.log
          if-no-files-found: warn
          retention-days: 1
