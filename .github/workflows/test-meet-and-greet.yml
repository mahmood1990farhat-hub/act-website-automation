name: Inspect Full Backend Reconciliation

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Check out GitHub target
        uses: actions/checkout@v4
        with:
          ref: 7b867f4f719486aad7b93e6a7928706b1f29fd74
          clean: true
          fetch-depth: 2

      - name: Reconcile and validate without deployment
        shell: bash
        run: |
          set -u
          set +e
          live=/var/www/atg/atg-backend/backend
          target="$GITHUB_WORKSPACE/act_backend-main"
          python="$live/env/bin/python"
          work=/home/act/reconcile-work/backend-full-${GITHUB_RUN_ID}
          proposal="$work/proposed-backend"
          raw="$work/private-raw"
          report="$GITHUB_WORKSPACE/reconciliation-report"
          mkdir -p "$proposal" "$raw" "$report"
          chmod 700 "$work" "$raw"

          echo "TARGET_SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" | tee "$report/identity.txt"
          echo "LIVE_HEAD=$(git -C "$live" rev-parse HEAD)" | tee -a "$report/identity.txt"
          echo "LIVE_BRANCH=$(git -C "$live" branch --show-current)" | tee -a "$report/identity.txt"
          echo "LIVE_REMOTE=$(git -C "$live" remote get-url origin)" | tee -a "$report/identity.txt"
          echo "ACT_SERVICE=$(systemctl is-active act.service 2>/dev/null || true)" | tee -a "$report/identity.txt"
          git -C "$live" status --short --untracked-files=all > "$report/live-status.txt"
          git -C "$live" diff --name-status > "$report/live-tracked-status.txt"

          cp -a "$target/." "$proposal/"
          rm -f "$proposal/celerybeat-schedule"
          chmod -R go-rwx "$proposal"

          "$python" - "$live" "$target" "$report" <<'PY'
          import ast
          import hashlib
          import os
          import subprocess
          import sys
          from pathlib import Path

          live = Path(sys.argv[1])
          target = Path(sys.argv[2])
          report = Path(sys.argv[3])

          def git_files(cwd, prefix=None):
              cmd = ["git", "-C", str(cwd), "ls-files", "-z"]
              if prefix:
                  cmd.extend(["--", prefix])
              raw = subprocess.check_output(cmd)
              return [p.decode("utf-8", "surrogateescape") for p in raw.split(b"\0") if p]

          target_files = [p for p in git_files(target.parent, "act_backend-main")]
          target_files = [p.removeprefix("act_backend-main/") for p in target_files]
          live_files = git_files(live)

          runtime_names = {
              "celerybeat-schedule", "db.sqlite3", ".DS_Store",
          }
          runtime_parts = {"__pycache__", ".pytest_cache", "static", "media", "logs", "env", "venv"}

          def sha(path):
              if not path.is_file():
                  return "missing"
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          module_files = {}
          for path in target_files:
              if not path.endswith(".py"):
                  continue
              if path.endswith("/__init__.py"):
                  module = path[:-12].replace("/", ".")
              else:
                  module = path[:-3].replace("/", ".")
              module_files[module] = path

          roots = [
              "apps.pricing.admin",
              "apps.pricing.services.extra_service_resolver",
              "apps.trips.views.calculate_trip_cost",
              "apps.trips.views.initiate_payment",
          ]
          dependencies = set()
          queue = list(roots)
          while queue:
              module = queue.pop(0)
              path = module_files.get(module)
              if not path or path in dependencies:
                  continue
              dependencies.add(path)
              try:
                  tree = ast.parse((target / path).read_text(encoding="utf-8"))
              except (SyntaxError, UnicodeDecodeError):
                  continue
              package = module.rsplit(".", 1)[0]
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:
                          parts = package.split(".")
                          base = ".".join(parts[: len(parts) - node.level + 1])
                          imported = f"{base}.{node.module}" if node.module else base
                      else:
                          imported = node.module or ""
                      names = [imported]
                      names.extend(f"{imported}.{alias.name}" for alias in node.names if alias.name != "*")
                  for name in names:
                      candidate = name
                      while candidate:
                          if candidate in module_files:
                              queue.append(candidate)
                              break
                          candidate = candidate.rpartition(".")[0]

          required_prefixes = (
              "apps/pricing/",
          )
          required_exact = {
              "apps/payments/models.py",
              "apps/payments/urls.py",
              "apps/payments/views/views.py",
              "apps/trips/models/trip.py",
              "apps/trips/serializers/trip.py",
              "apps/trips/urls.py",
              "apps/trips/views/calculate_trip_cost.py",
              "apps/trips/views/initiate_payment.py",
              "apps/vehicle/models.py",
              "utils/calculate_cost.py",
              "utils/utils_trip.py",
          }

          rows = []
          counts = {}
          for path in sorted(set(target_files) | set(live_files)):
              target_hash = sha(target / path)
              live_hash = sha(live / path)
              if target_hash == live_hash:
                  status = "identical"
              elif target_hash == "missing":
                  status = "live_only"
              elif live_hash == "missing":
                  status = "github_only"
              else:
                  status = "different"

              parts = set(Path(path).parts)
              if Path(path).name in runtime_names or parts & runtime_parts:
                  classification = "generated/runtime file"
              elif path in dependencies or path in required_exact or path.startswith(required_prefixes):
                  classification = "required Meet & Greet dependency"
              elif status == "live_only":
                  classification = "live-only source"
              elif status == "github_only":
                  classification = "unrelated GitHub update"
              elif status == "different":
                  classification = "uncertain"
              else:
                  classification = "identical"
              counts[(status, classification)] = counts.get((status, classification), 0) + 1
              if status != "identical":
                  rows.append((path, status, classification, live_hash, target_hash))

          with (report / "differing-files.tsv").open("w", encoding="utf-8") as handle:
              handle.write("path\tstatus\tclassification\tlive_sha256\tgithub_sha256\n")
              for row in rows:
                  handle.write("\t".join(row) + "\n")
          with (report / "comparison-summary.tsv").open("w", encoding="utf-8") as handle:
              handle.write("status\tclassification\tcount\n")
              for (status, classification), count in sorted(counts.items()):
                  handle.write(f"{status}\t{classification}\t{count}\n")
          with (report / "dependency-trace.txt").open("w", encoding="utf-8") as handle:
              for path in sorted(dependencies):
                  handle.write(path + "\n")

          migration_paths = sorted(
              path for path in set(target_files) | set(live_files)
              if "/migrations/" in path
          )
          with (report / "migration-file-comparison.tsv").open("w", encoding="utf-8") as handle:
              handle.write("path\tlive_sha256\tgithub_sha256\n")
              for path in migration_paths:
                  handle.write(f"{path}\t{sha(live / path)}\t{sha(target / path)}\n")

          print(f"DIFFERING_FILE_COUNT={len(rows)}")
          print(f"DEPENDENCY_FILE_COUNT={len(dependencies)}")
          PY

          readonly_settings="$proposal/myProject/ci_readonly_settings.py"
          test_settings="$proposal/myProject/ci_test_settings.py"
          ln -s "$live/.env" "$proposal/.env"
          cleanup() {
            rm -f "$proposal/.env" "$readonly_settings" "$test_settings"
            find "$proposal" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          }
          trap cleanup EXIT

          cat > "$readonly_settings" <<'PY'
          from .settings import *
          options = DATABASES["default"].setdefault("OPTIONS", {})
          existing = options.get("options", "")
          options["options"] = (existing + " -c default_transaction_read_only=on").strip()
          PY

          cat > "$test_settings" <<'PY'
          import os
          from .settings import *
          DATABASES["default"].setdefault("TEST", {})["NAME"] = os.environ["CI_TEST_DB_NAME"]
          MIGRATION_MODULES = {
              "admin": None, "auth": None, "contenttypes": None,
              "sessions": None, "accounts": None, "drivers": None,
              "passengers": None, "trips": None, "payments": None,
              "office": None, "vehicle": None, "complaints": None,
              "pricing": None, "earnings": None, "admin_panel": None,
              "silk": None, "token_blacklist": None,
          }
          PY

          sanitize() {
            sed -E \
              -e '/Invalid line:/d' \
              -e '/PASSWORD|SECRET|TOKEN|API_KEY|DATABASE_URL|PRIVATE_KEY/Id' \
              -e 's#(/[^ ]*\.env[^ ]*)#[REDACTED_ENV_PATH]#g' \
              "$1" > "$2"
          }

          cd "$proposal"
          "$python" -m compileall -q . > "$raw/compile.log" 2>&1
          compile_status=$?
          sanitize "$raw/compile.log" "$report/python-compile.txt"
          echo "PYTHON_COMPILE_EXIT=$compile_status" | tee "$report/validation-status.txt"

          export DJANGO_SETTINGS_MODULE=myProject.ci_readonly_settings
          "$python" manage.py check > "$raw/django-check.log" 2>&1
          check_status=$?
          sanitize "$raw/django-check.log" "$report/django-check.txt"
          echo "DJANGO_CHECK_EXIT=$check_status" | tee -a "$report/validation-status.txt"

          "$python" manage.py showmigrations > "$raw/showmigrations.log" 2>&1
          show_status=$?
          sanitize "$raw/showmigrations.log" "$report/showmigrations.txt"
          echo "SHOWMIGRATIONS_EXIT=$show_status" | tee -a "$report/validation-status.txt"

          "$python" manage.py makemigrations --check --dry-run > "$raw/makemigrations.log" 2>&1
          make_status=$?
          sanitize "$raw/makemigrations.log" "$report/makemigrations-check.txt"
          echo "MAKEMIGRATIONS_CHECK_EXIT=$make_status" | tee -a "$report/validation-status.txt"

          "$python" - "$report" > "$raw/schema.log" 2>&1 <<'PY'
          import django
          import sys
          from pathlib import Path
          from django.db import connection, transaction

          django.setup()
          report = Path(sys.argv[1])
          tables = [
              "pricing_pricingsettings", "pricing_pricingtier",
              "pricing_peaktimerule", "pricing_airportfee",
              "pricing_extraservicefee",
          ]
          with transaction.atomic():
              with connection.cursor() as cursor:
                  cursor.execute("SET TRANSACTION READ ONLY")
                  cursor.execute("SELECT current_schema()")
                  schema = cursor.fetchone()[0]
                  cursor.execute(
                      """
                      SELECT table_schema, table_name, column_name, data_type,
                             is_nullable, character_maximum_length
                      FROM information_schema.columns
                      WHERE table_name = ANY(%s)
                      ORDER BY table_name, ordinal_position
                      """,
                      [tables],
                  )
                  columns = cursor.fetchall()
                  cursor.execute(
                      """
                      SELECT app, name
                      FROM django_migrations
                      WHERE app IN ('pricing', 'payments', 'trips')
                      ORDER BY app, name
                      """
                  )
                  migrations = cursor.fetchall()
          with (report / "production-schema-columns.tsv").open("w", encoding="utf-8") as handle:
              handle.write("schema\ttable\tcolumn\ttype\tnullable\tmax_length\n")
              for row in columns:
                  handle.write("\t".join("" if value is None else str(value) for value in row) + "\n")
          with (report / "production-migration-records.tsv").open("w", encoding="utf-8") as handle:
              handle.write("app\tmigration\n")
              for row in migrations:
                  handle.write("\t".join(row) + "\n")
          print(f"PRODUCTION_SCHEMA={schema}")
          print(f"SCHEMA_COLUMN_COUNT={len(columns)}")
          print(f"MIGRATION_RECORD_COUNT={len(migrations)}")
          PY
          schema_status=$?
          sanitize "$raw/schema.log" "$report/schema-inspection-status.txt"
          echo "SCHEMA_INSPECTION_EXIT=$schema_status" | tee -a "$report/validation-status.txt"

          "$python" - "$report" > "$raw/model-metadata.log" 2>&1 <<'PY'
          import django
          import sys
          from pathlib import Path
          django.setup()
          from apps.pricing.models import AirportFee, ExtraServiceFee, PeakTimeRule, PricingSettings, PricingTier

          report = Path(sys.argv[1])
          models = [PricingSettings, PricingTier, PeakTimeRule, AirportFee, ExtraServiceFee]
          with (report / "github-pricing-model-fields.tsv").open("w", encoding="utf-8") as handle:
              handle.write("model\ttable\tfield\tinternal_type\tnull\tdefault\n")
              for model in models:
                  for field in model._meta.fields:
                      default = field.default
                      if callable(default):
                          default = getattr(default, "__name__", "callable")
                      handle.write(
                          f"{model.__name__}\t{model._meta.db_table}\t{field.name}\t"
                          f"{field.get_internal_type()}\t{field.null}\t{default}\n"
                      )
          PY
          model_status=$?
          sanitize "$raw/model-metadata.log" "$report/model-metadata-status.txt"
          echo "MODEL_METADATA_EXIT=$model_status" | tee -a "$report/validation-status.txt"

          pricing_test_files="$(find apps/pricing -path '*test*.py' -type f | sort)"
          printf '%s\n' "$pricing_test_files" > "$report/pricing-test-files.txt"
          if grep -RIlE 'admin|APIView|ViewSet|serializer|/api/' apps/pricing/tests --include='test*.py' > "$report/pricing-admin-api-test-files.txt"; then
            :
          else
            echo "none" > "$report/pricing-admin-api-test-files.txt"
          fi

          export CI_TEST_DB_NAME="test_act_reconcile_${GITHUB_RUN_ID}"
          export DJANGO_SETTINGS_MODULE=myProject.ci_test_settings
          "$python" - > "$raw/test-isolation.log" 2>&1 <<'PY'
          import django
          from django.db import connections
          django.setup()
          connection = connections["default"]
          production = str(connection.settings_dict.get("NAME") or "")
          test_name = str(connection.creation._get_test_db_name() or "")
          if not production or not test_name or production == test_name:
              raise SystemExit("Unsafe test database configuration")
          print(f"TEST_DATABASE={test_name}")
          PY
          isolation_status=$?
          sanitize "$raw/test-isolation.log" "$report/test-isolation.txt"
          echo "TEST_ISOLATION_EXIT=$isolation_status" | tee -a "$report/validation-status.txt"

          if test "$isolation_status" -eq 0; then
            "$python" manage.py test \
              apps.payments.test_urls \
              apps.payments.tests \
              apps.pricing.tests.test_extra_service_resolver \
              apps.pricing.tests.test_pricing_engine \
              apps.pricing.tests.test_airport_resolver \
              apps.pricing.tests.test_integration \
              apps.trips.tests.test_meet_and_greet_pricing \
              --noinput --verbosity=2 > "$raw/tests.log" 2>&1
            test_status=$?
          else
            test_status=99
            echo "Tests not run: isolation could not be confirmed" > "$raw/tests.log"
          fi
          sanitize "$raw/tests.log" "$report/tests.txt"
          echo "TEST_EXIT=$test_status" | tee -a "$report/validation-status.txt"

          echo "INSPECTION_ONLY=true" | tee -a "$report/validation-status.txt"
          echo "LIVE_FILES_MODIFIED=false" | tee -a "$report/validation-status.txt"
          echo "SERVICES_RESTARTED=false" | tee -a "$report/validation-status.txt"
          echo "MIGRATIONS_RUN=false" | tee -a "$report/validation-status.txt"

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-reconciliation-${{ github.run_id }}
          path: reconciliation-report/
          if-no-files-found: error
          retention-days: 7
