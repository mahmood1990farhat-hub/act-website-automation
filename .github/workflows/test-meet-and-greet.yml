name: Apply production Pricing migrations

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          ref: d30e13773e5dd2f1b816b09008b832aae1670235
          clean: true

      - name: Verify, migrate Pricing only, and verify again
        shell: bash
        run: |
          set -euo pipefail

          live=/var/www/atg/atg-backend/backend
          python="$live/env/bin/python"
          backend="$GITHUB_WORKSPACE/act_backend-main"
          report="$GITHUB_WORKSPACE/pricing-production-migration"
          backup=/home/act/reconcile-work/backups/pricing-pre-migration-20260729T223916Z-30496879585.dump
          expected_backup_hash=4857f5633628af815d706144e927c1a0b0dc9987817fe26a4fe10ae4d888e95e
          expected_source=d30e13773e5dd2f1b816b09008b832aae1670235

          rm -rf -- "$report"
          mkdir -p "$report"
          ln -s "$live/.env" "$backend/.env"
          cleanup() {
            rm -f "$backend/.env"
            find "$backend" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          }
          trap cleanup EXIT

          actual_source="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_source" = "$expected_source"
          printf 'EXPECTED_SOURCE_SHA=%s\nACTUAL_SOURCE_SHA=%s\nSOURCE_VERIFIED=true\n' \
            "$expected_source" "$actual_source" > "$report/source.txt"

          test -f "$backup"
          actual_backup_hash="$(sha256sum "$backup" | awk '{print $1}')"
          test "$actual_backup_hash" = "$expected_backup_hash"
          pg_restore --list "$backup" > /dev/null
          backup_mode="$(stat -c '%a' "$backup")"
          test "$backup_mode" = 600
          printf 'BACKUP_PATH=%s\nBACKUP_SHA256=%s\nBACKUP_MODE=%s\nPG_RESTORE_LIST_VERIFIED=true\n' \
            "$backup" "$actual_backup_hash" "$backup_mode" > "$report/backup-verification.txt"

          cd "$backend"
          DJANGO_SETTINGS_MODULE=myProject.settings "$python" - "$report/pre-state.json" \
            > "$report/preconditions.txt" <<'PY'
          import json
          import sys

          import django
          django.setup()
          from django.db import connection, transaction

          expected_counts = {
              'pricing_airportfee': 20,
              'pricing_peaktimerule': 1,
              'pricing_pricingsettings': 1,
              'pricing_pricingtier': 15,
          }

          with transaction.atomic():
              with connection.cursor() as cursor:
                  cursor.execute('SET TRANSACTION READ ONLY')
                  cursor.execute('SELECT current_schema()')
                  schema = cursor.fetchone()[0]
                  print(f'SCHEMA={schema}')

                  cursor.execute('SELECT app, name FROM django_migrations ORDER BY app, name')
                  all_migrations = [list(row) for row in cursor.fetchall()]
                  pricing = [name for app, name in all_migrations if app == 'pricing']
                  if pricing != ['0001_initial']:
                      raise SystemExit(f'Unexpected Pricing migration state: {pricing}')
                  print('PRICING_MIGRATIONS=0001_initial')

                  cursor.execute('SELECT to_regclass(%s)', [f'{schema}.pricing_extraservicefee'])
                  if cursor.fetchone()[0] is not None:
                      raise SystemExit('pricing_extraservicefee already exists')
                  print('EXTRA_SERVICE_TABLE_EXISTS=false')

                  for table, expected in expected_counts.items():
                      cursor.execute(f'SELECT COUNT(*) FROM {connection.ops.quote_name(table)}')
                      actual = cursor.fetchone()[0]
                      if actual != expected:
                          raise SystemExit(f'Unexpected row count for {table}: {actual}, expected {expected}')
                      print(f'ROW_COUNT\t{table}\t{actual}')

          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump(all_migrations, handle)
          print('PRECONDITIONS_VERIFIED=true')
          PY

          "$python" manage.py showmigrations pricing > "$report/showmigrations-before.txt" 2>&1

          set +e
          "$python" manage.py migrate pricing 0003 --noinput > "$report/migration-output.txt" 2>&1
          migration_status=$?
          set -e
          printf 'MIGRATION_EXIT=%s\n' "$migration_status" > "$report/migration-status.txt"
          test "$migration_status" -eq 0

          DJANGO_SETTINGS_MODULE=myProject.settings "$python" - "$report/pre-state.json" \
            > "$report/postconditions.txt" <<'PY'
          import json
          import sys

          import django
          django.setup()
          from django.db import connection, transaction

          expected_counts = {
              'pricing_airportfee': 20,
              'pricing_peaktimerule': 1,
              'pricing_pricingsettings': 1,
              'pricing_pricingtier': 15,
          }
          expected_new = {
              ('pricing', '0002_extra_service_fee'),
              ('pricing', '0003_extra_service_fee_priority'),
          }

          with open(sys.argv[1], encoding='utf-8') as handle:
              before = {tuple(row) for row in json.load(handle)}

          with transaction.atomic():
              with connection.cursor() as cursor:
                  cursor.execute('SET TRANSACTION READ ONLY')
                  cursor.execute('SELECT current_schema()')
                  schema = cursor.fetchone()[0]

                  cursor.execute('SELECT app, name FROM django_migrations ORDER BY app, name')
                  after = {tuple(row) for row in cursor.fetchall()}
                  new_records = after - before
                  if new_records != expected_new:
                      raise SystemExit(f'Unexpected new migration records: {sorted(new_records)}')
                  if before - after:
                      raise SystemExit(f'Migration records disappeared: {sorted(before - after)}')
                  print('NEW_MIGRATIONS=' + ','.join(f'{a}.{n}' for a, n in sorted(new_records)))

                  cursor.execute(
                      "SELECT name, applied AT TIME ZONE 'UTC' FROM django_migrations "
                      "WHERE app = %s ORDER BY name",
                      ['pricing'],
                  )
                  for name, applied in cursor.fetchall():
                      print(f'MIGRATION\tpricing\t{name}\t{applied.isoformat()}Z')

                  cursor.execute('SELECT to_regclass(%s)', [f'{schema}.pricing_extraservicefee'])
                  if cursor.fetchone()[0] is None:
                      raise SystemExit('pricing_extraservicefee was not created')
                  print('EXTRA_SERVICE_TABLE_EXISTS=true')

                  cursor.execute(
                      "SELECT column_name, data_type, is_nullable, column_default "
                      "FROM information_schema.columns "
                      "WHERE table_schema = %s AND table_name = %s AND column_name = %s",
                      [schema, 'pricing_extraservicefee', 'priority'],
                  )
                  priority = cursor.fetchone()
                  if not priority:
                      raise SystemExit('priority column is missing')
                  print('PRIORITY_COLUMN\t' + '\t'.join(str(value or '') for value in priority))

                  cursor.execute(
                      "SELECT conname, pg_get_constraintdef(oid) FROM pg_constraint "
                      "WHERE conrelid = %s::regclass AND contype = 'c' ORDER BY conname",
                      ['pricing_extraservicefee'],
                  )
                  constraints = cursor.fetchall()
                  priority_checks = [row for row in constraints if 'priority' in row[1].lower() and '>= 0' in row[1]]
                  if not priority_checks:
                      raise SystemExit(f'Expected non-negative priority constraint missing: {constraints}')
                  for name, definition in priority_checks:
                      print(f'PRIORITY_CONSTRAINT\t{name}\t{definition}')

                  cursor.execute(
                      "SELECT indexname FROM pg_indexes WHERE schemaname = %s AND tablename = %s",
                      [schema, 'pricing_extraservicefee'],
                  )
                  indexes = {row[0] for row in cursor.fetchall()}
                  expected_indexes = {
                      'pricing_ext_service_75ce8e_idx',
                      'pricing_ext_airport_5094b5_idx',
                  }
                  if not expected_indexes.issubset(indexes):
                      raise SystemExit(f'Historical indexes missing: {sorted(expected_indexes - indexes)}')
                  for name in sorted(expected_indexes):
                      print(f'INDEX\t{name}\tpresent')

                  for table, expected in expected_counts.items():
                      cursor.execute(f'SELECT COUNT(*) FROM {connection.ops.quote_name(table)}')
                      actual = cursor.fetchone()[0]
                      if actual != expected:
                          raise SystemExit(f'Row count changed for {table}: {actual}, expected {expected}')
                      print(f'ROW_COUNT\t{table}\t{actual}')

                  cursor.execute('SELECT COUNT(*) FROM pricing_extraservicefee')
                  extra_count = cursor.fetchone()[0]
                  if extra_count != 0:
                      raise SystemExit(f'pricing_extraservicefee is not empty: {extra_count}')
                  print('ROW_COUNT\tpricing_extraservicefee\t0')

          print('POSTCONDITIONS_VERIFIED=true')
          PY

          "$python" manage.py showmigrations pricing > "$report/showmigrations-after.txt" 2>&1
          "$python" manage.py check > "$report/django-check.txt" 2>&1
          printf 'SOURCE_DEPLOYED=false\nSERVICES_RESTARTED=false\nMEET_AND_GREET_SEEDED=false\n' > "$report/safety.txt"

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-production-migration-${{ github.run_id }}
          path: pricing-production-migration/
          if-no-files-found: error
          retention-days: 30
