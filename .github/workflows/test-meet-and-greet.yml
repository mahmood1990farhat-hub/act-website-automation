name: Prepare production Pricing migration

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out reviewed main source
        uses: actions/checkout@v4
        with:
          ref: d30e13773e5dd2f1b816b09008b832aae1670235
          clean: true

      - name: Back up and inspect Pricing migration state
        shell: bash
        run: |
          set -euo pipefail

          live=/var/www/atg/atg-backend/backend
          python="$live/env/bin/python"
          backend="$GITHUB_WORKSPACE/act_backend-main"
          report="$GITHUB_WORKSPACE/pricing-production-preflight"
          backup_dir=/home/act/reconcile-work/backups
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$backup_dir/pricing-pre-migration-${timestamp}-${GITHUB_RUN_ID}.dump"

          rm -rf -- "$report"
          mkdir -p "$report" "$backup_dir"
          chmod 700 "$backup_dir"
          ln -s "$live/.env" "$backend/.env"
          cleanup() {
            rm -f "$backend/.env"
            find "$backend" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          }
          trap cleanup EXIT

          cd "$backend"

          BACKUP_PATH="$backup" DJANGO_SETTINGS_MODULE=myProject.settings "$python" - > "$report/backup.txt" <<'PY'
          import hashlib
          import os
          import shutil
          import stat
          import subprocess

          import django
          django.setup()
          from django.db import connection

          config = connection.settings_dict
          if connection.vendor != 'postgresql':
              raise SystemExit('Production database is not PostgreSQL')

          pg_dump = shutil.which('pg_dump')
          pg_restore = shutil.which('pg_restore')
          if not pg_dump or not pg_restore:
              raise SystemExit('PostgreSQL backup tools are unavailable')

          backup = os.environ['BACKUP_PATH']
          command = [pg_dump, '--format=custom', '--no-owner', '--no-acl', '--file', backup]
          if config.get('HOST'):
              command.extend(['--host', str(config['HOST'])])
          if config.get('PORT'):
              command.extend(['--port', str(config['PORT'])])
          if config.get('USER'):
              command.extend(['--username', str(config['USER'])])
          command.append(str(config['NAME']))

          environment = os.environ.copy()
          if config.get('PASSWORD'):
              environment['PGPASSWORD'] = str(config['PASSWORD'])
          subprocess.run(command, env=environment, check=True)
          os.chmod(backup, stat.S_IRUSR | stat.S_IWUSR)
          subprocess.run(
              [pg_restore, '--list', backup],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=True,
          )

          digest = hashlib.sha256()
          with open(backup, 'rb') as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                  digest.update(chunk)

          mode = oct(os.stat(backup).st_mode & 0o777)
          if mode != '0o600':
              raise SystemExit(f'Unsafe backup permissions: {mode}')
          print(f'BACKUP_PATH={backup}')
          print(f'BACKUP_SIZE_BYTES={os.path.getsize(backup)}')
          print(f'BACKUP_SHA256={digest.hexdigest()}')
          print(f'BACKUP_MODE={mode}')
          print('PG_RESTORE_LIST_VERIFIED=true')
          PY

          DJANGO_SETTINGS_MODULE=myProject.settings "$python" - > "$report/baseline.txt" <<'PY'
          import django
          django.setup()
          from django.db import connection, transaction

          tables = [
              'pricing_airportfee',
              'pricing_peaktimerule',
              'pricing_pricingsettings',
              'pricing_pricingtier',
          ]
          with transaction.atomic():
              with connection.cursor() as cursor:
                  cursor.execute('SET TRANSACTION READ ONLY')
                  cursor.execute('SELECT current_schema()')
                  schema = cursor.fetchone()[0]
                  print(f'SCHEMA={schema}')
                  for table in tables:
                      cursor.execute('SELECT to_regclass(%s)', [f'{schema}.{table}'])
                      if cursor.fetchone()[0] is None:
                          raise SystemExit(f'Required table is missing: {table}')
                      cursor.execute(f'SELECT COUNT(*) FROM {connection.ops.quote_name(table)}')
                      print(f'ROW_COUNT\t{table}\t{cursor.fetchone()[0]}')

                  cursor.execute('SELECT to_regclass(%s)', [f'{schema}.pricing_extraservicefee'])
                  exists = cursor.fetchone()[0] is not None
                  print(f'EXTRA_SERVICE_TABLE_EXISTS={str(exists).lower()}')
                  if exists:
                      raise SystemExit('pricing_extraservicefee unexpectedly exists')

                  cursor.execute(
                      "SELECT app, name, applied AT TIME ZONE 'UTC' "
                      "FROM django_migrations WHERE app = %s ORDER BY applied, name",
                      ['pricing'],
                  )
                  for app, name, applied in cursor.fetchall():
                      print(f'MIGRATION\t{app}\t{name}\t{applied.isoformat()}Z')
          print('READ_ONLY_BASELINE=true')
          PY

          "$python" manage.py showmigrations pricing > "$report/showmigrations-pricing.txt" 2>&1
          "$python" manage.py migrate pricing 0003 --plan > "$report/migrate-plan.txt" 2>&1
          "$python" manage.py sqlmigrate pricing 0002 > "$report/sqlmigrate-0002.sql" 2>&1
          "$python" manage.py sqlmigrate pricing 0003 > "$report/sqlmigrate-0003.sql" 2>&1

          printf 'SOURCE_SHA=d30e13773e5dd2f1b816b09008b832aae1670235\nPRODUCTION_MIGRATIONS_RUN=false\nDEPLOYMENT_RUN=false\nSERVICES_RESTARTED=false\n' > "$report/safety.txt"

      - name: Upload non-secret preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-production-preflight-${{ github.run_id }}
          path: pricing-production-preflight/
          if-no-files-found: error
          retention-days: 7
