name: Deploy Meet and Greet Backend

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Check out reviewed merge
        uses: actions/checkout@v4
        with:
          ref: 7b867f4f719486aad7b93e6a7928706b1f29fd74
          clean: true
          fetch-depth: 2

      - name: Validate, deploy, and verify backend
        shell: bash
        run: |
          set -Eeuo pipefail

          live=/var/www/atg/atg-backend/backend
          source="$GITHUB_WORKSPACE/act_backend-main"
          python="$live/env/bin/python"
          target_sha=7b867f4f719486aad7b93e6a7928706b1f29fd74
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          rollback="/home/act/secure-backups/meet-greet-deploy-${stamp}-${GITHUB_RUN_ID}"
          stage="/home/act/reconcile-work/meet-greet-deploy-${GITHUB_RUN_ID}"

          files=(
            apps/payments/test_urls.py
            apps/payments/urls.py
            apps/pricing/admin.py
            apps/pricing/services/extra_service_resolver.py
            apps/pricing/tests/test_extra_service_resolver.py
            apps/trips/tests/__init__.py
            apps/trips/tests/test_meet_and_greet_pricing.py
            apps/trips/views/calculate_trip_cost.py
            apps/trips/views/initiate_payment.py
          )

          expected_dirty=(
            apps/admin_panel/serializers/trips.py
            apps/payments/models.py
            apps/payments/views/views.py
            apps/trips/models/trip.py
            apps/trips/serializers/trip.py
            apps/trips/services/pdf_generator.py
            apps/trips/templates/emails/admin_booking_notification.html
            apps/trips/templates/emails/trip_accepted_passenger.html
            apps/trips/templates/emails/trip_cancelled_passenger.html
            apps/trips/templates/pdf/booking_confirmation.html
            apps/trips/urls.py
            apps/trips/views/calculate_trip_cost.py
            apps/trips/views/initiate_payment.py
            apps/trips/views/passenger_trips.py
            apps/trips/views/user_trip.py
            celerybeat-schedule
            utils/calculate_cost.py
            utils/common/email.py
          )

          mkdir -p "$rollback/files" "$stage"
          chmod 700 "$rollback" "$stage"
          printf '%s\n' "${files[@]}" > "$rollback/deployment-manifest.txt"
          printf '%s\n' "${expected_dirty[@]}" | sort > "$rollback/expected-dirty.txt"

          echo "PREVIOUS_BACKEND_SHA=$(git -C "$live" rev-parse HEAD)"
          echo "TARGET_BACKEND_SHA=$target_sha"
          echo "ROLLBACK_PATH=$rollback"
          echo "VALIDATION_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          test "$(git -C "$live" rev-parse HEAD)" = bba521fba39a035b0323e0d9bba642a80e4cf965
          test -x "$python"

          git -C "$live" diff --name-only | sort > "$rollback/actual-dirty-before.txt"
          diff -u "$rollback/expected-dirty.txt" "$rollback/actual-dirty-before.txt"
          git -C "$live" diff --binary > "$rollback/live-before.patch"
          git -C "$live" status --short > "$rollback/live-status-before.txt"
          if test -e "$live/celerybeat-schedule"; then
            sha256sum "$live/celerybeat-schedule" > "$rollback/celerybeat-before.sha256"
          else
            touch "$rollback/celerybeat-was-absent"
          fi

          changed_migrations="$(git diff-tree --no-commit-id --name-only -r "$target_sha"^ "$target_sha" -- act_backend-main | grep '/migrations/' || true)"
          test -z "$changed_migrations"
          echo "MIGRATIONS_IN_TARGET=none"

          for path in "${files[@]}"; do
            mkdir -p "$stage/$(dirname "$path")" "$rollback/files/$(dirname "$path")"
            cp -a "$source/$path" "$stage/$path"
            if test -e "$live/$path"; then
              cp -a "$live/$path" "$rollback/files/$path"
              printf 'present\t%s\n' "$path" >> "$rollback/file-state.tsv"
            else
              printf 'absent\t%s\n' "$path" >> "$rollback/file-state.tsv"
            fi
          done

          sha256sum "${files[@]/#/$stage/}" > "$rollback/staged-sha256.txt"

          "$python" -m py_compile "${files[@]/#/$stage/}"
          echo "PYTHON_SYNTAX=pass"

          ln -s "$live/.env" "$stage/.env"
          cleanup_stage() {
            rm -f "$stage/.env" "$stage/myProject/ci_test_settings.py" "$stage/myProject/ci_test_urls.py"
            find "$stage" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          }
          trap cleanup_stage EXIT

          cp -a "$source/." "$stage/"
          rm -f "$stage/celerybeat-schedule"
          rm -f "$stage/.env"
          ln -s "$live/.env" "$stage/.env"

          cd "$stage"
          "$python" manage.py check
          echo "DJANGO_SYSTEM_CHECK=pass"

          printf 'urlpatterns = []\n' > "$stage/myProject/ci_test_urls.py"
          cat > "$stage/myProject/ci_test_settings.py" <<'PY'
          from .settings import *
          ROOT_URLCONF = "myProject.ci_test_urls"
          MIGRATION_MODULES = {
              "admin": None, "auth": None, "contenttypes": None,
              "sessions": None, "accounts": None, "drivers": None,
              "passengers": None, "trips": None, "payments": None,
              "office": None, "vehicle": None, "complaints": None,
              "pricing": None, "earnings": None, "admin_panel": None,
              "silk": None, "token_blacklist": None,
          }
          PY
          export DJANGO_SETTINGS_MODULE=myProject.ci_test_settings
          test_database="$("$python" - <<'PY'
          import django
          from django.db import connections
          django.setup()
          connection = connections["default"]
          production = str(connection.settings_dict.get("NAME") or "")
          test_name = str(connection.creation._get_test_db_name() or "")
          if not production or not test_name or production == test_name:
              raise SystemExit("Unsafe test database configuration")
          print(test_name)
          PY
          )"
          echo "ISOLATED_TEST_DATABASE=$test_database"
          "$python" manage.py test \
            apps.payments.test_urls \
            apps.payments.tests \
            apps.pricing.tests.test_extra_service_resolver \
            apps.pricing.tests.test_pricing_engine \
            apps.pricing.tests.test_airport_resolver \
            apps.pricing.tests.test_integration \
            apps.trips.tests.test_meet_and_greet_pricing \
            --noinput --verbosity=2
          echo "ISOLATED_TESTS=pass"

          unset DJANGO_SETTINGS_MODULE
          cleanup_stage

          rollback_live() {
            echo "ROLLBACK_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            while IFS=$'\t' read -r state path; do
              if test "$state" = present; then
                cp -a "$rollback/files/$path" "$live/$path"
              else
                rm -f "$live/$path"
              fi
            done < "$rollback/file-state.tsv"
            sudo systemctl restart act.service || true
            sudo systemctl is-active act.service || true
            echo "ROLLBACK_COMPLETED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }

          deployed=false
          on_error() {
            status=$?
            if test "$deployed" = true; then
              rollback_live
            fi
            exit "$status"
          }
          trap on_error ERR

          for path in "${files[@]}"; do
            mkdir -p "$live/$(dirname "$path")"
            cp -a "$source/$path" "$live/$path"
          done
          deployed=true

          "$python" -m py_compile "${files[@]/#/$live/}"
          cd "$live"
          "$python" manage.py check

          for path in "${files[@]}"; do
            cmp -s "$live/$path" "$source/$path"
          done
          if test -f "$rollback/celerybeat-was-absent"; then
            test ! -e "$live/celerybeat-schedule"
          else
            sha256sum -c "$rollback/celerybeat-before.sha256"
          fi
          echo "DEPLOYED_FILES_MATCH_TARGET=true"

          sudo systemctl restart act.service
          restart_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "RESTART_TIMESTAMP_UTC=$restart_timestamp"
          test "$(sudo systemctl is-active act.service)" = active
          echo "ACT_SERVICE=active"

          sleep 8
          sudo journalctl -u act.service --since "$restart_timestamp" --no-pager -n 100 > "$rollback/act-service-after.log"
          if grep -Eiq 'Traceback|ModuleNotFoundError|ImportError|SyntaxError|failed to start|exited with status' "$rollback/act-service-after.log"; then
            echo "DAPHNE_STARTUP_ERRORS=true"
            grep -Ei 'Traceback|ModuleNotFoundError|ImportError|SyntaxError|failed to start|exited with status' "$rollback/act-service-after.log"
            false
          fi
          echo "DAPHNE_STARTUP_ERRORS=false"

          health_code="$(curl -sS -o /tmp/act-backend-health.out -w '%{http_code}' --max-time 20 https://airportandcitytransfer.com/api/pricing/settings/)"
          case "$health_code" in
            200|401|403) ;;
            *) echo "BACKEND_HEALTH_HTTP=$health_code"; false ;;
          esac
          echo "BACKEND_HEALTH_HTTP=$health_code"

          cat > /tmp/act-quote-off.json <<'JSON'
          {
            "pickup_location": {"lat": 51.5074, "lng": -0.1278},
            "dropoff_location": {"lat": 51.4700, "lng": -0.4543},
            "trip_date": "2026-08-15",
            "trip_time": "10:00",
            "passengers_count": 1,
            "large_suitcase": 0,
            "small_suitcase": 0,
            "booking_details": {"additional_requirements": {"meet_and_greet": false}}
          }
          JSON
          sed 's/"meet_and_greet": false/"meet_and_greet": true/' \
            /tmp/act-quote-off.json > /tmp/act-quote-on.json
          quote_url=https://airportandcitytransfer.com/api/trips/calculate-trip-cost/
          off_code="$(curl -sS -o /tmp/act-quote-off-response.json -w '%{http_code}' \
            --max-time 45 -H 'Content-Type: application/json' \
            --data-binary @/tmp/act-quote-off.json "$quote_url")"
          on_code="$(curl -sS -o /tmp/act-quote-on-response.json -w '%{http_code}' \
            --max-time 45 -H 'Content-Type: application/json' \
            --data-binary @/tmp/act-quote-on.json "$quote_url")"
          test "$off_code" = 200
          test "$on_code" = 200
          "$python" - <<'PY'
          import json
          from decimal import Decimal

          with open('/tmp/act-quote-off-response.json', encoding='utf-8') as handle:
              off = json.load(handle)
          with open('/tmp/act-quote-on-response.json', encoding='utf-8') as handle:
              on = json.load(handle)
          if not off.get('success') or not on.get('success'):
              raise SystemExit('Quote endpoint did not return success')
          off_by_id = {item['id']: item for item in off.get('car_type', [])}
          verified = []
          for selected in on.get('car_type', []):
              fee = Decimal(str(selected.get('meet_and_greet_total', 0)))
              baseline = off_by_id.get(selected['id'])
              if fee <= 0 or not baseline:
                  continue
              if Decimal(str(baseline.get('meet_and_greet_total', 0))) != 0:
                  raise SystemExit('Unselected quote contains a Meet & Greet charge')
              delta = Decimal(str(selected['total_cost'])) - Decimal(str(baseline['total_cost']))
              if abs(delta - fee) > Decimal('0.02'):
                  raise SystemExit('Meet & Greet quote delta does not equal configured fee')
              verified.append((selected['id'], selected['name_en'], str(fee)))
          if not verified:
              raise SystemExit('No configured Meet & Greet fee was returned by the live quote')
          print('MEET_GREET_QUOTE_VERIFIED=' + json.dumps(verified))
          PY

          test -f "$live/apps/pricing/services/extra_service_resolver.py"
          grep -q 'apply_meet_and_greet_pricing' "$live/apps/trips/views/calculate_trip_cost.py"
          grep -q 'calculate_authoritative_payment_price' "$live/apps/trips/views/initiate_payment.py"
          grep -q 'persist_authoritative_meet_and_greet' "$live/apps/trips/views/initiate_payment.py"
          echo "QUOTE_MEET_GREET_WIRING=verified"
          echo "AUTH_PAYMENT_AUTHORITATIVE_WIRING=verified_by_source_and_isolated_tests"
          echo "GUEST_PAYMENT_AUTHORITATIVE_WIRING=verified_by_source_and_isolated_tests"
          echo "LIVE_PAYMENT_ENDPOINTS_CALLED=false"
          echo "STRIPE_PAYMENT_CREATED=false"
          echo "PRODUCTION_BOOKING_CREATED=false"

          sha256sum "$rollback/live-before.patch" "$rollback/staged-sha256.txt" > "$rollback/SHA256SUMS"
          chmod -R go-rwx "$rollback"
          trap - ERR
          echo "DEPLOYMENT_COMPLETED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
