name: Assess live backend reconciliation

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  assess:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out intended GitHub release
        uses: actions/checkout@v4
        with:
          ref: d30e13773e5dd2f1b816b09008b832aae1670235
          fetch-depth: 0
          clean: true

      - name: Build read-only reconciliation report
        shell: bash
        run: |
          set -euo pipefail

          live=/var/www/atg/atg-backend/backend
          target="$GITHUB_WORKSPACE/act_backend-main"
          python="$live/env/bin/python"
          report="$GITHUB_WORKSPACE/live-reconciliation-report"
          backup=/home/act/reconcile-work/backups/pricing-pre-migration-20260729T223916Z-30496879585.dump
          expected_backup_hash=4857f5633628af815d706144e927c1a0b0dc9987817fe26a4fe10ae4d888e95e

          rm -rf -- "$report"
          mkdir -p "$report"

          LIVE="$live" TARGET="$target" REPORT="$report" python3 - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          live = Path(os.environ['LIVE'])
          target = Path(os.environ['TARGET'])
          report = Path(os.environ['REPORT'])

          def run(args, cwd=None, check=True):
              return subprocess.run(
                  args,
                  cwd=cwd,
                  check=check,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

          def digest_file(path):
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def digest_git_blob(repo, revision, path):
              result = run(['git', 'show', f'{revision}:{path}'], cwd=repo, check=False)
              if result.returncode:
                  return ''
              return hashlib.sha256(result.stdout).hexdigest()

          def classify(path, tracked_status):
              lower = path.lower()
              name = Path(path).name.lower()
              if lower == '.env' or lower.startswith('.env.') or name.endswith('.env'):
                  return 'backup' if 'backup' in lower or name.endswith('.save') else 'secret/configuration'
              if lower == 'env' or lower.startswith('env/'):
                  return 'virtual environment'
              if lower == 'media' or lower.startswith('media/'):
                  return 'media/upload'
              if lower == 'logs' or lower.startswith('logs/') or lower.endswith('.log'):
                  return 'log'
              if lower == 'static' or lower.startswith('static/') or '__pycache__' in lower or lower.endswith(('.pyc', '.pyo')):
                  return 'runtime/generated file'
              if lower == 'celerybeat-schedule' or lower.startswith('celerybeat-schedule'):
                  return 'runtime/generated file'
              if 'backup' in lower or lower.endswith(('.bak', '.save', '.dump', '.sqlite', '.db')):
                  return 'backup'
              if lower.startswith(('tmp/', 'temp/', '.tmp/')) or name.startswith(('tmp', 'scratch')) or name in {'db_models.py'}:
                  return 'scratch/temporary'
              if tracked_status.strip() or lower.endswith(('.py', '.html', '.json', '.yaml', '.yml', '.toml', '.ini')):
                  return 'production source change'
              return 'scratch/temporary'

          status = run(
              ['git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'],
              cwd=live,
          ).stdout.decode('utf-8', errors='replace').split('\0')
          entries = []
          for item in status:
              if not item:
                  continue
              code = item[:2]
              path = item[3:]
              entries.append((code, path, classify(path, code)))

          with (report / 'inventory.tsv').open('w', encoding='utf-8') as handle:
              handle.write('status\tclassification\tpath\n')
              for code, path, category in entries:
                  handle.write(f'{code}\t{category}\t{path}\n')

          counts = {}
          for _, _, category in entries:
              counts[category] = counts.get(category, 0) + 1
          with (report / 'inventory-summary.txt').open('w', encoding='utf-8') as handle:
              handle.write(f'TOTAL_STATUS_PATHS={len(entries)}\n')
              for category in sorted(counts):
                  handle.write(f'CATEGORY\t{category}\t{counts[category]}\n')

          def history_matches(repo, path, wanted_hash):
              if not wanted_hash:
                  return []
              commits = run(
                  ['git', 'log', '--all', '--format=%H', '--', path],
                  cwd=repo,
                  check=False,
              ).stdout.decode().splitlines()
              matches = []
              for commit in commits:
                  if digest_git_blob(repo, commit, path) == wanted_hash:
                      matches.append(commit)
                      if len(matches) == 3:
                          break
              return matches

          tracked = [(code, path) for code, path, category in entries if code != '??']
          source_candidates = [
              (code, path)
              for code, path, category in entries
              if category == 'production source change'
          ]
          with (report / 'source-comparison.tsv').open('w', encoding='utf-8') as handle:
              handle.write(
                  'status\tpath\tworking_sha256\tlive_head_sha256\tgithub_sha256\t'
                  'equals_live_head\tequals_github\tgitlab_history_matches\tgithub_history_matches\t'
                  'live_diff_numstat\tgithub_diff_numstat\thunk_contexts\n'
              )
              for code, path in source_candidates:
                  working_path = live / path
                  github_path = target / path
                  working_hash = digest_file(working_path) if working_path.is_file() else ''
                  head_hash = digest_git_blob(live, 'HEAD', path)
                  github_hash = digest_file(github_path) if github_path.is_file() else ''
                  gitlab_matches = history_matches(live, path, working_hash)
                  github_matches = history_matches(Path(os.environ['GITHUB_WORKSPACE']), f'act_backend-main/{path}', working_hash)

                  live_stat = run(
                      ['git', 'diff', '--numstat', 'HEAD', '--', path],
                      cwd=live,
                      check=False,
                  ).stdout.decode('utf-8', errors='replace').strip().replace('\t', ',')
                  github_stat = ''
                  contexts = []
                  if working_path.is_file() and github_path.is_file():
                      comparison = run(
                          ['git', 'diff', '--no-index', '--unified=0', '--', str(github_path), str(working_path)],
                          check=False,
                      ).stdout.decode('utf-8', errors='replace')
                      for line in comparison.splitlines():
                          if line.startswith('@@'):
                              context = line.rsplit('@@', 1)[-1].strip()
                              if context and context not in contexts:
                                  contexts.append(context)
                      numstat = run(
                          ['git', 'diff', '--no-index', '--numstat', '--', str(github_path), str(working_path)],
                          check=False,
                      ).stdout.decode('utf-8', errors='replace').strip().replace('\t', ',')
                      github_stat = numstat
                  elif working_path.is_file():
                      github_stat = 'working-only'
                  elif github_path.is_file():
                      github_stat = 'github-only'

                  row = [
                      code,
                      path,
                      working_hash,
                      head_hash,
                      github_hash,
                      str(bool(working_hash and working_hash == head_hash)).lower(),
                      str(bool(working_hash and working_hash == github_hash)).lower(),
                      ','.join(gitlab_matches),
                      ','.join(github_matches),
                      live_stat,
                      github_stat,
                      ' | '.join(contexts[:20]),
                  ]
                  handle.write('\t'.join(value.replace('\n', ' ') for value in row) + '\n')

          with (report / 'tracked-status.txt').open('w', encoding='utf-8') as handle:
              for code, path in tracked:
                  handle.write(f'{code}\t{path}\n')
          PY

          {
            printf 'LIVE_HEAD='; git -C "$live" rev-parse HEAD
            printf 'LIVE_BRANCH='; git -C "$live" branch --show-current
            printf 'TARGET_SHA='; git -C "$GITHUB_WORKSPACE" rev-parse HEAD
            git -C "$live" remote -v
          } > "$report/git-identity.txt"

          for path in .env env media logs static celerybeat-schedule; do
            full="$live/$path"
            if test -e "$full" || test -L "$full"; then
              if test -d "$full"; then
                count="$(find "$full" -type f 2>/dev/null | wc -l)"
                bytes="$(du -sb "$full" 2>/dev/null | awk '{print $1}')"
                printf 'PRESERVE\t%s\tdirectory\tfiles=%s\tbytes=%s\n' "$path" "$count" "$bytes"
              else
                size="$(stat -c '%s' "$full")"
                modified="$(date -u -d "@$(stat -c '%Y' "$full")" +%Y-%m-%dT%H:%M:%SZ)"
                printf 'PRESERVE\t%s\tfile\tbytes=%s\tmodified=%s\n' "$path" "$size" "$modified"
              fi
            else
              printf 'PRESERVE\t%s\tmissing\n' "$path"
            fi
          done > "$report/persistent-paths.txt"

          test -f "$backup"
          backup_hash="$(sha256sum "$backup" | awk '{print $1}')"
          test "$backup_hash" = "$expected_backup_hash"
          printf 'BACKUP_PATH=%s\nBACKUP_SHA256=%s\nBACKUP_VERIFIED=true\n' \
            "$backup" "$backup_hash" > "$report/backup.txt"

          cd "$live"
          DJANGO_SETTINGS_MODULE=myProject.settings "$python" - > "$report/pricing-state.txt" <<'PY'
          import django
          django.setup()
          from django.db import connection, transaction

          with transaction.atomic():
              with connection.cursor() as cursor:
                  cursor.execute('SET TRANSACTION READ ONLY')
                  cursor.execute('SELECT current_schema()')
                  schema = cursor.fetchone()[0]
                  cursor.execute(
                      "SELECT name, applied AT TIME ZONE 'UTC' FROM django_migrations "
                      "WHERE app = %s ORDER BY name",
                      ['pricing'],
                  )
                  for name, applied in cursor.fetchall():
                      print(f'MIGRATION\tpricing\t{name}\t{applied.isoformat()}Z')
                  cursor.execute('SELECT to_regclass(%s)', [f'{schema}.pricing_extraservicefee'])
                  print(f'EXTRA_SERVICE_TABLE_EXISTS={str(cursor.fetchone()[0] is not None).lower()}')
          PY

          systemctl show act.service \
            --property=Id,LoadState,ActiveState,SubState,User,Group,FragmentPath,WorkingDirectory,ExecStart \
            > "$report/act-service.txt"
          systemctl is-active act.service > "$report/act-service-active.txt"
          printf 'LIVE_FILES_MODIFIED=false\nDATABASE_WRITES=false\nSERVICES_RESTARTED=false\nDEPLOYMENT_RUN=false\n' > "$report/safety.txt"

      - name: Upload metadata-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reconciliation-metadata-${{ github.run_id }}
          path: live-reconciliation-report/
          if-no-files-found: error
          retention-days: 7
